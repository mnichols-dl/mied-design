openapi: 3.0.3
info:
  title: MiEdWorkforce Credentialing API
  version: 1.0.0
  description: |
    Manages educator credential lifecycle including applications, issuance, renewals,
    endorsements, and credential definitions. Primary consumers are educators submitting
    and tracking applications, administrative processors reviewing and approving flagged
    applications, and internal domain services (e.g. Staffing) validating educator eligibility.

servers:
  - url: http://credentialing-api.default.svc.cluster.local/api/v1
    description: Internal AKS cluster
  - url: https://api.miedworkforce.mi.gov/credentialing/api/v1
    description: External via APIM

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ----------------------------------------------------------------------------
  # CREDENTIAL APPLICATIONS
  # ----------------------------------------------------------------------------

  /applications:
    get:
      summary: List applications
      operationId: listApplications
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.view
      x-scope-sensitive: false
      description: |
        Returns applications visible to the caller. Educators see only their own
        applications; admins and processors see applications within their assigned
        scope, resolved server-side from the caller's identity.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: applicationType
          in: query
          schema:
            type: string
            enum: [New, Renewal, EndorsementAddition, Permit]
        - name: applicantUniqueId
          in: query
          description: Admin only — filter by specific applicant
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Submit new credential application
      operationId: submitApplication
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.submit
      x-scope-sensitive: false
      description: |
        Submits a new credential application (New, Renewal, EndorsementAddition, or Permit).
        Scope is self-only and resolved server-side from the authenticated user's identity.
        Returns required documents and payment information needed to advance the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationType, credentialDefinitionId, applicantUniqueId]
              properties:
                applicationType:
                  type: string
                  enum: [New, Renewal, EndorsementAddition, Permit]
                credentialDefinitionId:
                  type: string
                  format: uuid
                  description: Reference to credential type being applied for
                applicantUniqueId:
                  type: string
                  description: Mi-Key Unique ID of applicant
                requestedEndorsements:
                  type: array
                  items:
                    type: object
                    required: [endorsementDefinitionId, gradeBand]
                    properties:
                      endorsementDefinitionId:
                        type: string
                        format: uuid
                      gradeBand:
                        $ref: '#/components/schemas/GradeBand'
                businessRuleResponses:
                  type: object
                  additionalProperties:
                    type: string
                  description: Key-value pairs for dynamic business rule questions
                mentorAssignment:
                  $ref: '#/components/schemas/MentorAssignment'
                  description: Required for certain permit types
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationStatus'
                  requiredDocuments:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequiredDocument'
                  requiredPayment:
                    $ref: '#/components/schemas/PaymentRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /applications/{applicationId}:
    get:
      summary: Get application details
      operationId: getApplication
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.view
      x-scope-sensitive: false
      description: |
        Returns full application detail. Scope is resolved server-side from the
        application's owning educator — X-Organization-Context is not required.
        Educators can only retrieve their own applications.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete draft application
      operationId: deleteApplication
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.delete
      x-scope-sensitive: false
      description: |
        Deletes an application. Only allowed when the application is in Draft status.
        Scope is self-only and resolved server-side — educators may only delete their
        own applications.
        Note: the permissions catalog currently states "Submitted" — treat Draft as
        correct here; permissions catalog should be updated to match.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '204':
          description: Application deleted
        '400':
          description: Cannot delete — application is not in Draft status
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}/approve:
    post:
      summary: Approve application (admin)
      operationId: approveApplication
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.approve
        - credentialing.application.bypass-validation
      x-scope-sensitive: false
      description: |
        Transitions application from RequiresManualReview (or eligible status) to Approved,
        issuing the credential. Scope is resolved server-side from the application's owning
        organization — X-Organization-Context is not required.
        The bypass-validation permission is required only when overridePprHold is true;
        callers without it should omit or set that field to false.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                processorNotes:
                  type: string
                  maxLength: 2000
                overridePprHold:
                  type: boolean
                  description: Requires credentialing.application.bypass-validation permission
                  default: false
      responses:
        '200':
          description: Application approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationStatus'
                  credentialId:
                    type: string
                    format: uuid
                    description: Issued credential ID (if immediately issued)
        '400':
          description: Cannot approve — prerequisites not met
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}/deny:
    post:
      summary: Deny application (admin)
      operationId: denyApplication
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.deny
      x-scope-sensitive: false
      description: |
        Transitions application to Denied status. Scope is resolved server-side from
        the application's owning organization — X-Organization-Context is not required.
        Denial reason is required and will be surfaced to the applicant.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [denialReason]
              properties:
                denialReason:
                  type: string
                  maxLength: 2000
                denialCategory:
                  type: string
                  enum: [InsufficientDocumentation, FailedAssessments, PprBlocked, PolicyViolation, Other]
      responses:
        '200':
          description: Application denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # RENEWALS
  # ----------------------------------------------------------------------------

  /applications/renewals:
    get:
      summary: List renewal applications
      operationId: listRenewals
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.view
      x-scope-sensitive: false
      description: |
        Returns renewal applications visible to the caller. Educators see only their
        own; admins and processors see renewals within their assigned scope, resolved
        server-side from the caller's identity.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of renewal applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Submit credential renewal
      operationId: submitRenewal
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.submit
      x-scope-sensitive: false
      description: |
        Submits a renewal application for an existing credential. Scope is self-only
        and resolved server-side from the authenticated user's identity.
        Some renewal types require additional inputs (e.g. individualDevelopmentPlanId
        for FullYearBasicSubstitute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialId]
              properties:
                credentialId:
                  type: string
                  format: uuid
                  description: Credential being renewed
                renewalType:
                  type: string
                  enum: [Standard, FullYearBasicSubstitute, FullYearShortageSubstitute]
                individualDevelopmentPlanId:
                  type: string
                  format: uuid
                  description: Required for FullYearBasicSubstitute renewals
      responses:
        '201':
          description: Renewal application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationStatus'
                  requiredDocuments:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequiredDocument'
        '400':
          description: Credential not eligible for renewal
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Credential not found

  /applications/bulk-renewals:
    post:
      summary: Initiate bulk renewal process (admin)
      operationId: initiateBulkRenewals
      tags: [Applications]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.manual-submit
      x-scope-sensitive: false
      description: |
        Batch renewal for multiple credentials approaching expiration. Creates renewal
        applications for all qualifying credentials. Returns a jobId and statusUrl
        to track async progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialType, expirationDateRange]
              properties:
                credentialType:
                  type: string
                  description: Credential definition ID or category
                expirationDateRange:
                  type: object
                  required: [from, to]
                  properties:
                    from:
                      type: string
                      format: date
                    to:
                      type: string
                      format: date
                excludeEducatorIds:
                  type: array
                  items:
                    type: string
                  description: Educators to exclude from bulk process
      responses:
        '202':
          description: Bulk renewal process initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  estimatedApplicationCount:
                    type: integer
                  statusUrl:
                    type: string
                    format: uri
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------------------
  # ENDORSEMENT APPLICATIONS
  # ----------------------------------------------------------------------------

  /applications/endorsements:
    get:
      summary: List endorsement addition applications
      operationId: listEndorsementApplications
      tags: [Applications, Endorsements]
      x-access: internal-user
      x-permissions-required:
        - credentialing.application.view
      x-scope-sensitive: false
      description: |
        Returns endorsement addition applications visible to the caller. Educators
        see only their own; admins and processors see applications within their
        assigned scope, resolved server-side from the caller's identity.
      parameters:
        - name: credentialId
          in: query
          description: Filter by specific credential
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of endorsement addition applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Apply to add endorsement to existing credential
      operationId: submitEndorsementAddition
      tags: [Applications, Endorsements]
      x-access: internal-user
      x-permissions-required:
        - credentialing.endorsement.add
      x-scope-sensitive: false
      description: |
        Submits an application to add an endorsement to an existing valid credential.
        Scope is self-only and resolved server-side from the authenticated user's identity.
        Returns required assessments that must be satisfied before approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialId, endorsementDefinitionId, gradeBand]
              properties:
                credentialId:
                  type: string
                  format: uuid
                  description: Existing credential to add endorsement to
                endorsementDefinitionId:
                  type: string
                  format: uuid
                gradeBand:
                  $ref: '#/components/schemas/GradeBand'
                assessmentResultIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: References to existing assessment results already on file
      responses:
        '201':
          description: Endorsement application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationStatus'
                  requiredAssessments:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequiredAssessment'
        '400':
          description: Credential not valid or endorsement not compatible
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Credential or endorsement definition not found

  # ----------------------------------------------------------------------------
  # PERMITS
  # ----------------------------------------------------------------------------

  /applications/permits/admin-issue:
    post:
      summary: Submit temporary permit application (standard org-submitted path)
      operationId: adminIssuePermit
      tags: [Permits]
      x-access: internal-user
      x-permissions-required:
        - credentialing.permit.issue
      x-scope-sensitive: false
      description: |
        The standard, everyday intake path for temporary permit applications — a
        district/ISD/staffing-agency user submits on behalf of an educator (educators do
        not self-submit permit applications; see "Submit Permit Application" in
        credentialing-sequences.md). Follows the normal application pipeline: PPR
        clearance check, eligibility validation, and standard payment/manual-review
        routing — nothing is bypassed by using this endpoint. Scope is resolved
        server-side from the caller's organizational context. Fully audited.

        NOTE: an earlier version of this endpoint's description framed it as an
        "emergency"/bypass path with expedited, no-payment auto-approval. No FDD source
        document reviewed supports that behavior (FDD 17's permit documents and FDD 11's
        bulk-renewal wireframes both show normal payment/PPR/review processing regardless
        of submitter). If a genuinely distinct expedited/bypass capability is confirmed as
        a real requirement later, model it as a separate endpoint/permission rather than
        reintroducing bypass behavior here — see "Issue Temporary Permit — Exceptional
        Cases (Admin)" in credentialing-sequences.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialDefinitionId, recipientUniqueId, validFrom, validTo]
              properties:
                credentialDefinitionId:
                  type: string
                  format: uuid
                  description: Must reference a permit-type credential definition
                recipientUniqueId:
                  type: string
                validFrom:
                  type: string
                  format: date
                validTo:
                  type: string
                  format: date
                justification:
                  type: string
                  maxLength: 2000
                mentorAssignment:
                  $ref: '#/components/schemas/MentorAssignment'
      responses:
        '201':
          description: Permit issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                    format: uuid
                  certificatePdfUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Insufficient permissions or PPR clearance failed

  # ----------------------------------------------------------------------------
  # ISSUED CREDENTIALS
  # ----------------------------------------------------------------------------

  /credentials:
    get:
      summary: Search credentials
      operationId: searchCredentials
      tags: [Credentials]
      x-access: internal-user
      x-permissions-required:
        - credentialing.credential.view
      x-scope-sensitive: false
      description: |
        Searches issued credentials. Educators see only their own; admins and
        processors see credentials within their assigned scope, resolved server-side
        from the caller's identity.
      parameters:
        - name: educatorUniqueId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CredentialStatus'
        - name: credentialType
          in: query
          schema:
            type: string
        - name: expiringBefore
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated credential search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /credentials/{credentialId}:
    get:
      summary: Get credential
      operationId: getCredential
      tags: [Credentials]
      x-access: internal-user
      x-permissions-required:
        - credentialing.credential.view
      x-scope-sensitive: false
      description: |
        Returns full detail for a single issued credential including all endorsements.
        Scope is resolved server-side from the credential's owning educator —
        X-Organization-Context is not required. Educators can only retrieve their
        own credentials.
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Credential detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /credentials/{credentialId}/suspend:
    post:
      summary: Suspend credential (admin)
      operationId: suspendCredential
      tags: [Credentials]
      x-access: internal-user
      x-permissions-required:
        - credentialing.credential.suspend
      x-scope-sensitive: false
      description: |
        Transitions credential from Valid to Suspended. Scope is resolved server-side
        from the credential's owning organization — X-Organization-Context is not required.
        Effective date defaults to today if not provided.
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 2000
                effectiveDate:
                  type: string
                  format: date
                  description: Defaults to today if not specified
      responses:
        '200':
          description: Credential suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/CredentialStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /credentials/{credentialId}/revoke:
    post:
      summary: Revoke credential (admin)
      operationId: revokeCredential
      tags: [Credentials]
      x-access: internal-user
      x-permissions-required:
        - credentialing.credential.revoke
      x-scope-sensitive: false
      description: |
        Permanently transitions credential from Valid or Suspended to Revoked.
        Scope is resolved server-side from the credential's owning organization —
        X-Organization-Context is not required.
        This action cannot be undone; use suspend if temporary action is intended.
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 2000
                effectiveDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Credential revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/CredentialStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /credentials/print:
    post:
      summary: Generate credential certificate PDF
      operationId: printCredential
      tags: [Credentials]
      x-access: internal-user
      x-permissions-required:
        - credentialing.credential.print
      x-scope-sensitive: false
      description: |
        Generates a printable PDF certificate for a credential. Scope is resolved
        server-side — educators can print their own credentials; admins with
        system-wide scope can print any credential.
        Returns a time-limited download URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialId]
              properties:
                credentialId:
                  type: string
                  format: uuid
                includeEndorsements:
                  type: boolean
                  default: true
      responses:
        '200':
          description: PDF generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                    format: uuid
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /educators/{educatorId}/credentials:
    get:
      summary: Get educator credential summary
      operationId: getEducatorCredentials
      tags: [Credentials]
      # NOTE: Non-standard — this endpoint supports two access patterns.
      # internal-user: MiLogin token; used when Staffing is acting on behalf of a
      #   logged-in user (e.g. a staffing coordinator checking placement eligibility).
      # internal-service: Managed Identity / mTLS; used when Staffing is running a
      #   scheduled or background job (e.g. nightly placement validation). No user
      #   token is present in this case.
      # Consuming teams must ensure the correct token type is supplied for each usage.
      x-access: internal-user, internal-service
      x-permissions-required:
        - credentialing.credential.view
      x-scope-sensitive: false
      description: |
        Returns all active credentials and endorsements for an educator.
        Scope is resolved server-side from the educator's identity —
        X-Organization-Context is not required.

        Supports two access patterns (non-standard — see x-access note above):
        - **internal-user**: MiLogin token; used when Staffing is acting on behalf of a
          logged-in user (e.g. a staffing coordinator checking placement eligibility).
        - **internal-service**: Managed Identity / mTLS; used when Staffing is running a
          scheduled or background job (e.g. nightly placement validation). No user
          token is present in this case.
      parameters:
        - name: educatorId
          in: path
          required: true
          schema:
            type: string
          description: Mi-Key Unique ID or internal educator ID
        - name: includeExpired
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Educator credential summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducatorCredentialSummary'
        '403':
