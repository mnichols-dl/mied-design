      x-scope-sensitive: false
      description: |
        Called by Azure Synapse Pipeline on a nightly schedule. Marks pending
        requests past the expiration threshold as Expired and invalidates their
        approval links. Notifies affected users and Lead Admins.
        Authenticated via Managed Identity / mTLS.
      responses:
        '202':
          description: Expiration job initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/jobs/deactivate-inactive-users:
    post:
      summary: Trigger inactivity-based account deactivation job (Synapse)
      operationId: triggerDeactivateInactiveUsers
      tags: [AdminJobs]
      x-access: internal-service
      x-permissions-required:
        - iam.inactivity.run
      x-scope-sensitive: false
      description: |
        Called by Azure Synapse Pipeline on the first Friday of each month.
        Evaluates active InactivityPolicy configuration and deactivates accounts
        inactive beyond the configured threshold (default 84 months).
        Authenticated via Managed Identity / mTLS.
      responses:
        '202':
          description: Deactivation job initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/jobs/generate-reports:
    post:
