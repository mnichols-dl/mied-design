      operationId: triggerGenerateReports
      tags: [AdminJobs]
      x-access: internal-service
      x-permissions-required:
        - iam.reports.view
      x-scope-sensitive: false
      description: |
        Called by Azure Synapse Pipeline on Mondays at 8 AM. Generates and emails
        weekly authorization summary reports to System Admins.
        Authenticated via Managed Identity / mTLS.
      responses:
        '202':
          description: Report generation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------------------
  # IDENTITY RESOLUTION
  #
  # Identity resolution/matching against Mi-Key is a single capability owned by IAM
  # regardless of which actor or domain triggers it. Citizen self-service entry points
  # live under /citizen-identity/*; business-user-triggered entry points (invoked by
  # Staffing on behalf of an already-authorized district user) and the Identity
  # Administrator review/resolution/admin-update surface live under
  # /identity-resolution/*. Other domains never implement their own matching state.
  # ----------------------------------------------------------------------------

  /citizen-identity/account-creation:
    post:
      summary: Submit Citizen Account Creation identity request
      operationId: submitCitizenAccountCreation
      tags: [CitizenIdentity]
      x-access: internal-user
      x-permissions-required:
        - iam.citizen-identity.submit-request
      x-scope-sensitive: false
      description: |
        Submits validated demographic data for a first-time Citizen User (no existing
        Unique ID) to Mi-Key for probabilistic matching. Returns the immediate outcome
        for Match/No-Match; for Near Match, creates a "Requires Resolution" item
        and blocks dashboard access until an Identity Administrator resolves it.
        See `IdentityRequest` in iam-domain.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenIdentityRequestCreate'
      responses:
        '200':
          description: Match or No-Match — Unique ID assigned immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '202':
          description: Near Match — flagged for Identity Administrator review; dashboard access blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /citizen-identity/account-update:
    post:
      summary: Submit Citizen Account Update identity request
      operationId: submitCitizenAccountUpdate
      tags: [CitizenIdentity]
      x-access: internal-user
      x-permissions-required:
        - iam.citizen-identity.submit-request
      x-scope-sensitive: false
      description: |
        Submits validated demographic changes for an existing Citizen User to Mi-Key.
        Primary Demographic fields are rejected server-side if the user's Unique ID is
        associated with active employment (see `staffing-domain.md`). Near Match holds
        the update and locks Primary/Secondary fields, but does not block dashboard access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenIdentityRequestCreate'
      responses:
        '200':
          description: Match — Master Record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '202':
          description: Near Match — flagged for Identity Administrator review; update held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Attempted to edit a Primary Demographic field while associated with active employment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /citizen-identity/requests/my-requests:
    get:
      summary: List current citizen's own identity requests
      operationId: listOwnCitizenIdentityRequests
      tags: [CitizenIdentity]
      x-access: internal-user
      x-permissions-required:
        - iam.citizen-identity.view-own-request
      x-scope-sensitive: false
      description: |
        Returns the authenticated citizen's own pending/historical identity requests.
        Never includes Mi-Key candidate match data.
      responses:
        '200':
          description: List of the citizen's own requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityResolutionRequestResponse'

  /citizen-identity/requests/{requestId}/cancel:
    post:
      summary: Cancel own pending Account Update request (Near Match only)
      operationId: cancelOwnCitizenIdentityRequest
      tags: [CitizenIdentity]
      x-access: internal-user
      x-permissions-required:
        - iam.citizen-identity.cancel-own-request
      x-scope-sensitive: false
      description: |
        Citizen cancels their own pending AccountUpdate-type request while it is
        RequiresResolution. AccountCreation-type requests cannot be self-cancelled.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /identity-resolution/requests:
    post:
      summary: Submit a business-user-triggered identity resolution request (New ID or Link ID)
      operationId: submitBusinessUserIdentityRequest
      tags: [IdentityResolution]
      x-access: internal-service
      x-scope-sensitive: false
      description: |
        Called by Staffing (or another domain) on behalf of an already-authorized
        business user to trigger Mi-Key identity resolution. The calling domain is
        responsible for checking the user's own permission for the underlying business
        action (e.g. `staffing.employee-roster.add-employee`) before calling this
        endpoint; IAM does not re-check a human permission here since the caller is a
        trusted internal service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/NewIdRequestCreate'
                - $ref: '#/components/schemas/LinkIdRequestCreate'
      responses:
        '200':
          description: Match — Unique ID assigned immediately (NewId only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '201':
          description: No Match — new Unique ID created immediately (NewId only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '202':
          description: Near Match (NewId) or LinkId submission — RequiresResolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /identity-resolution/requests/{requestId}/resolve:
    post:
      summary: Self-resolve a business-user Near Match by selecting a potential match
      operationId: selfResolveIdentityRequest
      tags: [IdentityResolution]
      x-access: internal-user
      x-permissions-required:
        - staffing.employee-roster.add-employee
        - staffing.employee-roster.update-demographics
      x-scope-sensitive: false
      description: |
        The requesting business user confirms one of the Mi-Key candidates is the
        correct individual. Only valid for `BusinessUserStaffing`-origin `NewId` and
        `DemographicUpdate` requests; a citizen can never call this (see Citizen Near
        Match Resolution rule in iam-domain.md) — citizen requests always escalate to
        the Identity Administrator. One of the listed permissions is required depending
        on the underlying request's type (`NewId` requires add-employee;
        `DemographicUpdate` requires update-demographics).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedUniqueId]
              properties:
                selectedUniqueId:
                  type: string
      responses:
        '200':
          description: Near match resolved; Unique ID confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /identity-resolution/requests/{requestId}/escalate:
    post:
      summary: Escalate a business-user New ID Near Match for Identity Administrator review
      operationId: escalateIdentityRequest
      tags: [IdentityResolution]
      x-access: internal-user
      x-permissions-required:
        - staffing.employee-roster.add-employee
      x-scope-sensitive: false
      description: |
        The requesting district user rejects all Mi-Key potential matches and requests
        a new Unique ID be created, subject to Identity Administrator review. Only valid
        for `NewId` requests — `DemographicUpdate` has no escalation path.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justificationText]
              properties:
                justificationText:
                  type: string
                  maxLength: 2000
      responses:
        '202':
          description: Escalated for Identity Administrator review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /identity-resolution/requests:
    get:
      summary: List identity resolution requests requiring administrator review
      operationId: listIdentityResolutionRequests
      tags: [IdentityResolution]
      x-access: internal-user
      x-permissions-required:
        - iam.identity-admin.view-pending-requests
      x-scope-sensitive: false
      description: |
        Returns identity resolution requests, filterable by status and type, across
        every request origin — citizen Near Match, business-user New ID escalations,
        and Link ID requests. Defaults to items requiring Identity Administrator
        review (`status=RequiresResolution`).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RequiresResolution, Resolved, Denied, Cancelled]
            default: RequiresResolution
        - name: requestType
          in: query
          schema:
            type: string
            enum: [AccountCreation, AccountUpdate, NewId, DemographicUpdate, LinkId]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated identity resolution requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdentityResolutionRequestDetail'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '403':
          $ref: '#/components/responses/Forbidden'

  /identity-resolution/requests/{requestId}/admin-resolve:
    post:
      summary: Resolve an identity resolution request awaiting administrator review
      operationId: adminResolveIdentityRequest
      tags: [IdentityResolution]
      x-access: internal-user
      x-permissions-required:
        - iam.identity-admin.resolve-request
      x-scope-sensitive: false
      description: |
        Identity Administrator resolves a RequiresResolution item. For Near Match
        types (AccountCreation/AccountUpdate/NewId): Match (use an existing Unique ID),
        CreateNew (no true match), or Cancel. For LinkId: ApproveLink (Mi-Key retires
        the secondary ID and merges to primary) or Deny.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityResolutionAction'
      responses:
        '200':
          description: Request resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolutionRequestDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /identity-resolution/person-records/{userId}:
    patch:
      summary: Directly update a person's record (Identity Administrator)
      operationId: adminUpdatePersonRecord
      tags: [IdentityResolution]
      x-access: internal-user
      x-permissions-required:
        - iam.identity-admin.update-person-record
      x-scope-sensitive: false
      description: |
        Identity Administrator directly updates a person's demographic record via the
        Mi-Key Update Service, bypassing probabilistic matching entirely. Used for data
        errors that citizen/business self-service cannot fix (e.g., locked fields).
        Requires an audit note. Notifies the person and, if applicable, the employing
        district(s).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [demographicFields, auditNote]
              properties:
                demographicFields:
                  type: object
                  description: Field/value pairs to update
                auditNote:
                  type: string
                  maxLength: 2000
                  description: Required justification for the direct update
      responses:
        '200':
          description: Person record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # EXTERNAL (PUBLIC / UNAUTHENTICATED) - via APIM
  # ----------------------------------------------------------------------------

  /removal-requests:
    post:
      summary: Submit public authorization removal request (external)
      operationId: submitRemovalRequest
      tags: [RemovalRequests]
      x-access: external-public
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Unauthenticated endpoint for external parties (e.g., former supervisors, HR)
        to request removal of a user's authorization. Routed to System Admin queue for
        manual review before any authorization is revoked. Accessible via APIM public endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemovalRequestCreate'
      responses:
        '201':
          description: Removal request submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  referenceId:
                    type: string
                    description: Reference ID for tracking the request
                  message:
                    type: string
                    example: Your request has been submitted. A System Administrator will review it within 2 business days.
        '400':
          $ref: '#/components/responses/BadRequest'

  /removal-requests/{referenceId}:
    get:
      summary: Check status of removal request (external)
      operationId: getRemovalRequestStatus
      tags: [RemovalRequests]
      x-access: external-public
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Unauthenticated endpoint for requestors to check the status of their submitted
        removal request using the reference ID provided at submission.
        Accessible via APIM public endpoint.
      parameters:
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removal request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  referenceId:
                    type: string
                  status:
                    type: string
                    enum: [PendingReview, Approved, Denied]
                  submittedAt:
                    type: string
                    format: date-time
                  resolvedAt:
                    type: string
                    format: date-time
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrganizationCode:
      name: organizationCode
      in: path
      required: true
      schema:
        type: string

    OrganizationContext:
      name: X-Organization-Context
      in: header
      required: true
      description: |
        The organization code representing the caller's active authorization context.
        Used by IAM to determine which organizational scope applies when evaluating
        permissions. Must match an organization for which the caller holds the required
        permission (directly or transitively via the org hierarchy).
        Required on all scope-sensitive operations (x-scope-sensitive: true).
      schema:
        type: string
        example: district-10

  schemas:

    # --------------------------------------------------------------------------
    # Enums
    # --------------------------------------------------------------------------

    RequestStatus:
      type: string
      enum:
        - Pending
        - Approved
        - Denied
        - Withdrawn
        - Expired
      description: Lifecycle state of an authorization request

    AuthorizationStatus:
      type: string
      enum:
        - Active
        - Inactive
      description: Current state of a granted authorization

    MiLoginType:
      type: string
      enum:
        - Citizen
        - Business
        - Worker
      description: MiLogin identity provider type

    ScopeType:
      type: string
      enum:
        - Individual
        - Building
        - District
        - ISD
        - EPP
        - PLS
        - Nonpublic
        - System
      description: Organizational boundary type for scope assignment

    OrganizationType:
      type: string
      enum:
        - Building
        - District
        - ISD
        - EPP
        - PLS
        - Nonpublic

    # --------------------------------------------------------------------------
    # Value Objects
    # --------------------------------------------------------------------------

    Scope:
      type: object
      required: [scopeType]
      properties:
        scopeType:
          $ref: '#/components/schemas/ScopeType'
        organizationCode:
          type: string
          description: |
            Required for all scope types except Individual and System.
            References organization in EEM / Organization Reference Data.
          nullable: true

    DateRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    # --------------------------------------------------------------------------
    # Authorization Request Schemas
    # --------------------------------------------------------------------------

    AuthorizationRequestCreate:
      type: object
      required: [roleIds, scope, justification]
      properties:
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: Roles being requested at the specified scope
        scope:
          $ref: '#/components/schemas/Scope'
        justification:
          type: string
          maxLength: 2000
          description: Business justification for the access request

    AuthorizationRequestResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        requestedRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        scope:
          $ref: '#/components/schemas/Scope'
        routedToLeadAdmin:
          type: string
          description: Email address of Lead Admin the approval was routed to (masked for privacy)
          example: j***@district5.edu
        approvalLinkExpiresAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time

    AuthorizationRequestSummary:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        requestedRoles:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/Scope'
        organizationName:
          type: string
        submittedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    PendingApprovalSummary:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        requestingUserName:
          type: string
        requestingUserEmail:
          type: string
          format: email
        requestedRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        scope:
          $ref: '#/components/schemas/Scope'
        organizationName:
          type: string
        justification:
          type: string
        submittedAt:
          type: string
          format: date-time
        approvalLinkExpiresAt:
          type: string
          format: date-time

    # --------------------------------------------------------------------------
    # Authorization Schemas
    # --------------------------------------------------------------------------

    AuthorizationDetail:
      type: object
      properties:
        authorizationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        scope:
          $ref: '#/components/schemas/Scope'
        organizationName:
          type: string
          nullable: true
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
          description: Lead Admin name, "SYSTEM-BOOTSTRAP", or "ADMIN-MANUAL"
        miLoginType:
          $ref: '#/components/schemas/MiLoginType'

    # --------------------------------------------------------------------------
    # Role Schemas
    # --------------------------------------------------------------------------

    RoleSummary:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        applicableScopeTypes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeType'
        status:
          type: string
          enum: [Active, Deprecated]

    RoleDetail:
      allOf:
        - $ref: '#/components/schemas/RoleSummary'
        - type: object
          properties:
            description:
              type: string
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/PermissionSummary'
            userGroupCategory:
              type: string
              description: Grouping category for UI display

    PermissionSummary:
      type: object
      properties:
        permissionId:
          type: string
          description: Dot-notation identifier (e.g., "staffing.employee.view")
          example: staffing.employee.view
        displayName:
          type: string
        isScopeSensitive:
          type: boolean
          description: If true, requires organization context when evaluated
        domain:
          type: string
          description: Owning domain (e.g., "staffing", "credentialing", "iam")

    # --------------------------------------------------------------------------
    # User Schemas
    # --------------------------------------------------------------------------

    UserSummary:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        uniqueId:
          type: string
          description: Mi-Key Unique ID (may be null for Business/Worker users)
          nullable: true
        displayName:
          type: string
        email:
          type: string
          format: email
        miLoginType:
          $ref: '#/components/schemas/MiLoginType'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        activeAuthorizationCount:
          type: integer

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            miLoginId:
              type: string
              description: MiLogin identity reference
            authorizations:
              type: array
              items:
                $ref: '#/components/schemas/AuthorizationDetail'
            accountStatus:
              type: string
              enum: [Active, Inactive]
            createdAt:
              type: string
              format: date-time

    # --------------------------------------------------------------------------
    # Organization Schemas
    # --------------------------------------------------------------------------

    OrganizationSummary:
      type: object
      properties:
        organizationCode:
          type: string
        organizationName:
          type: string
        organizationType:
          $ref: '#/components/schemas/OrganizationType'
        parentOrganizationCode:
          type: string
          nullable: true

    OrganizationDetail:
      allOf:
        - $ref: '#/components/schemas/OrganizationSummary'
        - type: object
          properties:
            status:
              type: string
              enum: [Active, Inactive]
            leadAdminEmail:
              type: string
              format: email
              nullable: true
            hierarchy:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationSummary'
              description: Parent chain from immediate parent to root

    # --------------------------------------------------------------------------
    # Identity Resolution Schemas
    #
    # Shared across every origin (citizen self-service, business-user-triggered).
    # See IdentityResolutionRequest in iam-domain.md.
    # --------------------------------------------------------------------------

    CitizenIdentityRequestCreate:
      type: object
      required: [demographicFields, attestation]
      properties:
        demographicFields:
          type: object
          description: >
            Citizen-submitted demographic data per FDD 15.8/15.10 (name, DOB, sex,
            address, SSN or noSsnFlag, optional PIC/Unique ID hint, etc.). Field-level
            requirement status is defined in Identity Validations.xlsx, not enumerated
            here.
        noSsnFlag:
          type: boolean
          default: false
          description: Only valid on Account Creation, and only for Student Intern / Credential Applicant purposes
        picHint:
          type: string
          nullable: true
          description: Optional Personnel Identification Code the citizen believes is theirs (Account Creation only, FDD 15.8.2)
        attestation:
          type: boolean
          enum: [true]
          description: Citizen attests to accuracy of submitted data

    NewIdRequestCreate:
      type: object
      required: [employeeRecordId, demographicFields]
      description: Submitted by Staffing on behalf of a district user adding a new employee with no known Unique ID.
      properties:
        employeeRecordId:
          type: string
          format: uuid
          description: Staffing's EmployeeRoster record ID this resolution is for
        demographicFields:
          type: object
          description: Employee demographic data already validated by Staffing

    LinkIdRequestCreate:
      type: object
      required: [employeeRecordId, primaryUniqueId, secondaryUniqueId, justificationText]
      description: Submitted by Staffing on behalf of a district user requesting two Unique IDs be merged.
      properties:
        employeeRecordId:
          type: string
          format: uuid
        primaryUniqueId:
          type: string
          description: The Unique ID to retain
        secondaryUniqueId:
          type: string
          description: The Unique ID to retire and merge into primary
        justificationText:
          type: string
          maxLength: 2000

    IdentityResolutionRequestResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        requestOrigin:
          type: string
          enum: [CitizenSelfService, BusinessUserStaffing]
        requestType:
          type: string
          enum: [AccountCreation, AccountUpdate, NewId, DemographicUpdate, LinkId]
        status:
          type: string
          enum: [PendingMiKeyMatch, Matched, NoMatchCreated, RequiresResolution, Resolved, Denied, Cancelled]
        assignedUniqueId:
          type: string
          nullable: true
          description: Populated once Matched, NoMatchCreated, or Resolved
        submittedAt:
          type: string
          format: date-time

    IdentityResolutionRequestDetail:
      allOf:
        - $ref: '#/components/schemas/IdentityResolutionRequestResponse'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              nullable: true
              description: NULL for BusinessUserStaffing origin
            employeeRecordId:
              type: string
              format: uuid
              nullable: true
              description: Staffing's EmployeeRoster record ID; NULL for CitizenSelfService origin
            submittedDemographics:
              type: object
              description: The requester's submitted data snapshot
            miKeyPotentialMatches:
              type: array
              description: >
                Candidate Mi-Key master records for comparison. Shown to the requester
                directly for BusinessUserStaffing origin; never exposed to the citizen
                for CitizenSelfService origin (Identity Administrator only).
              items:
                type: object
            noSsnFlag:
              type: boolean
              nullable: true
            linkDetails:
              type: object
              nullable: true
              description: Populated for LinkId requests (primaryUniqueId, secondaryUniqueId, justificationText)
            resolutionOutcome:
              type: string
              nullable: true
              enum: [Match, CreateNew, ApproveLink, Cancel]
            resolvedBy:
              type: string
              format: uuid
              nullable: true
              description: Identity Administrator; NULL if self-resolved by the requester
            selfResolved:
              type: boolean
              description: True if the requesting business user resolved the Near Match themselves
            resolvedAt:
              type: string
              format: date-time
              nullable: true
            adminNotes:
              type: string
              nullable: true

    IdentityResolutionAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [Match, CreateNew, ApproveLink, Deny, Cancel]
        matchedUniqueId:
          type: string
          nullable: true
          description: Required when action=Match; the existing Unique ID to associate
        notes:
          type: string
          nullable: true
          description: Required when action=Deny or Cancel (explanatory notes returned to the requester); optional otherwise

    # --------------------------------------------------------------------------
    # Removal Request Schemas (External / Public)
    # --------------------------------------------------------------------------

    RemovalRequestCreate:
      type: object
      required: [targetUserEmail, requestorName, requestorEmail, requestorRelationship, justification, attestation]
      properties:
        targetUserEmail:
          type: string
          format: email
          description: Email of user whose access should be removed
        targetUserName:
          type: string
          description: Full name of user whose access should be removed
        targetMiLoginId:
          type: string
          description: MiLogin ID if known (optional, helps Admin identify user)
          nullable: true
        requestorName:
          type: string
        requestorEmail:
          type: string
          format: email
        requestorRelationship:
          type: string
          description: Relationship to target user (e.g., "Former supervisor", "HR Department")
        justification:
          type: string
          maxLength: 2000
          description: Reason for removal request
        attestation:
          type: boolean
          description: Requestor attests that information is accurate and request is legitimate
          enum: [true]

    # --------------------------------------------------------------------------
    # Report Entry Schemas
    # --------------------------------------------------------------------------

    NewUserReportEntry:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        miLoginType:
          $ref: '#/components/schemas/MiLoginType'
        createdAt:
          type: string
          format: date-time
        firstAuthorizationOrganization:
          type: string
          nullable: true

    DeniedRequestReportEntry:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        requestingUserName:
          type: string
        requestingUserEmail:
          type: string
          format: email
        requestedRoles:
          type: array
          items:
            type: string
        organizationName:
          type: string
        deniedAt:
          type: string
          format: date-time
        denialReason:
          type: string
          nullable: true

    InactiveUserReportEntry:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        miLoginType:
          $ref: '#/components/schemas/MiLoginType'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        inactiveDays:
          type: integer
        activeAuthorizationCount:
          type: integer

    # --------------------------------------------------------------------------
    # Shared / Common Schemas
    # --------------------------------------------------------------------------

    JobResult:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        triggeredAt:
          type: string
          format: date-time
        estimatedCompletionAt:
          type: string
          format: date-time
        statusUrl:
          type: string
          format: uri

    Error:
      type: object
      properties:
        error:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Validation error or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Duplicate request — pending request already exists for this scope/role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    MiLogin:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://milogin.michigan.gov/oauth/authorize
          tokenUrl: https://milogin.michigan.gov/oauth/token
          scopes:
            iam:read: Read authorization and role data
            iam:write: Submit requests and manage authorizations
            iam:admin: Administrative operations (manual grant, revoke)

security:
  - MiLogin: [iam:read]