openapi: 3.0.3
info:
  title: MiEdWorkforce IAM API
  version: 1.0.0
  description: |
    Manages user identity, role assignments, and organization-scoped authorizations
    across the MiEdWorkforce platform. Primary consumers are end users requesting
    access, Lead Administrators approving requests, and internal domain services
    performing permission checks.

servers:
  - url: http://iam-api.default.svc.cluster.local/api/v1
    description: Internal AKS cluster
  - url: https://api.miedworkforce.mi.gov/iam/api/v1
    description: External via APIM

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ----------------------------------------------------------------------------
  # AUTHORIZATION REQUESTS
  # ----------------------------------------------------------------------------

  /authorization-requests:
    get:
      summary: List current user's authorization requests
      operationId: listAuthorizationRequests
      tags: [AuthorizationRequests]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.view-own
      x-scope-sensitive: false
      description: |
        Returns all authorization requests submitted by the authenticated user.
        Scope is resolved server-side from the user's identity — X-Organization-Context
        is not required.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of authorization requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorizationRequestSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Submit new authorization request
      operationId: submitAuthorizationRequest
      tags: [AuthorizationRequests]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.request
      x-scope-sensitive: false
      description: |
        Submit a request for role assignment at a specific organizational scope.
        Routes to the Lead Administrator of the target organization for approval.
        Business/Worker users only; Citizens are auto-approved at Individual scope.
        Scope is determined by the request body — X-Organization-Context is not required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequestCreate'
      responses:
        '201':
          description: Request created and routed to Lead Administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /authorization-requests/pending-approvals:
    get:
      summary: List requests awaiting the current user's approval (Lead Admins)
      operationId: listPendingApprovals
      tags: [AuthorizationRequests]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.approve
      x-scope-sensitive: true
      description: |
        Returns authorization requests routed to the authenticated user as Lead Administrator.
        Returns only requests for organizations within the scope specified by
        X-Organization-Context. Users with ISD-level authorization will see results
        for all constituent districts and buildings.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of pending approval requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingApprovalSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '403':
          $ref: '#/components/responses/Forbidden'

  /authorization-requests/{requestId}/withdraw:
    post:
      summary: Withdraw a pending authorization request
      operationId: withdrawAuthorizationRequest
      tags: [AuthorizationRequests]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.withdraw
      x-scope-sensitive: false
      description: |
        User withdraws their own pending request. Invalidates the Lead Admin approval link.
        Withdrawn requests cannot be re-activated; user must submit a new request.
        Scope is resolved server-side from the request's owning user.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Request withdrawn successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/RequestStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # AUTHORIZATION APPROVALS AND DENIALS (TOKEN-BASED)
  # ----------------------------------------------------------------------------

  /authorization-approvals/{token}:
    post:
      summary: Approve authorization request via email link token
      operationId: approveAuthorizationRequest
      tags: [AuthorizationRequests]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.approve
      x-scope-sensitive: false
      description: |
        Lead Administrator approves a pending authorization request using the
        single-use token from the approval email link. Optionally modifies roles
        before approving. Token expires after 7 days. Scope is resolved server-side
        from the token's associated request — X-Organization-Context is not required.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Single-use cryptographically signed approval token from email link
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                modifiedRoles:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Override requested roles before approving (optional)
                comments:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Request approved and authorization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationId:
                    type: string
                    format: uuid
                  grantedRoles:
                    type: array
                    items:
                      type: string
                  scope:
                    $ref: '#/components/schemas/Scope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /authorization-denials/{token}:
    post:
      summary: Deny authorization request via email link token
      operationId: denyAuthorizationRequest
      tags: [AuthorizationRequests]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.deny
      x-scope-sensitive: false
      description: |
        Lead Administrator denies a pending authorization request using the
        single-use token from the approval email link. Scope is resolved server-side
        from the token's associated request — X-Organization-Context is not required.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: Reason for denial communicated to the requesting user
      responses:
        '200':
          description: Request denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/RequestStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # AUTHORIZATIONS
  # ----------------------------------------------------------------------------

  /authorizations/my-authorizations:
    get:
      summary: Get current user's active authorizations
      operationId: getMyAuthorizations
      tags: [Authorizations]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.view-own
      x-scope-sensitive: false
      description: |
        Returns all active authorizations for the authenticated user, filtered by
        current MiLogin identity type (Citizen/Business/Worker). Used by the UI
        to populate the scope selector. Scope is always the caller's own identity —
        X-Organization-Context is not required.
      responses:
        '200':
          description: User's active authorizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  miLoginType:
                    $ref: '#/components/schemas/MiLoginType'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorizationDetail'

  /authorizations/{authorizationId}:
    delete:
      summary: Self-remove authorization
      operationId: selfRemoveAuthorization
      tags: [Authorizations]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.remove-own
      x-scope-sensitive: false
      description: |
        User removes their own authorization. Immediate effect; no approval required.
        Lead Administrator is notified. Authorization cache is immediately invalidated.
        Scope is resolved server-side from the authorization's owning user.
      parameters:
        - $ref: '#/components/parameters/AuthorizationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '204':
          description: Authorization removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /authorizations/{authorizationId}/revoke:
    post:
      summary: Admin revoke authorization
      operationId: revokeAuthorization
      tags: [Authorizations]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.revoke
      x-scope-sensitive: true
      description: |
        Transitions authorization from Active to Inactive.
        Administrator revokes a user's authorization within the scope specified by
        X-Organization-Context. Users with ISD-level authorization can revoke for all
        constituent districts and buildings. Immediate effect; authorization cache
        invalidated. Lead Administrator and affected user are notified.
      parameters:
        - $ref: '#/components/parameters/AuthorizationId'
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Authorization revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/AuthorizationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /authorizations/manual-grant:
    post:
      summary: Admin manually grant authorization (bypass approval workflow)
      operationId: manualGrantAuthorization
      tags: [Authorizations]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.grant
      x-scope-sensitive: false
      description: |
        System Administrator directly grants an authorization without Lead Admin approval.
        Requires justification. User and Lead Admin are notified. Use for emergency access
        or special circumstances. Fully audit-logged. Scope is agnostic — System Admin
        permission applies system-wide; X-Organization-Context is not required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, roleIds, scope, justification]
              properties:
                targetUserId:
                  type: string
                  format: uuid
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                scope:
                  $ref: '#/components/schemas/Scope'
                justification:
                  type: string
                  maxLength: 2000
                  description: Required explanation for bypassing normal approval workflow
      responses:
        '201':
          description: Authorization granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationId:
                    type: string
                    format: uuid
                  grantedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------------------
  # PERMISSIONS (INTERNAL SERVICE)
  # ----------------------------------------------------------------------------

  /permissions/check:
    post:
      summary: Check one or more permissions for a user (internal service)
      operationId: checkPermissions
      tags: [Permissions]
      x-access: internal-service
      x-permissions-required:
        - iam.permission.view
      x-scope-sensitive: false
      description: |
        Called by any domain service to evaluate one or more permission checks in a
        single request. All checks are evaluated for the same userId and miLoginType.
        Each check may specify a different organizationCode for scope-sensitive permissions.
        Returns a result map keyed by caller-supplied checkId values.
        Minimum 1, maximum 20 checks per request.
        Results cached per (userId, permission, organizationCode) tuple at 5-minute TTL.
        Critical permissions (iam.authorization.grant, iam.authorization.revoke) always
        bypass cache. Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, miLoginType, checks]
              properties:
                userId:
                  type: string
                  format: uuid
                miLoginType:
                  $ref: '#/components/schemas/MiLoginType'
                checks:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [checkId, permission]
                    properties:
                      checkId:
                        type: string
                        description: |
                          Caller-supplied identifier echoed back in results
                          (e.g., "canViewEmployees", "canEditDemographics").
                        maxLength: 100
                      permission:
                        type: string
                        example: staffing.employee.view
                      organizationCode:
                        type: string
                        nullable: true
                        description: Required for scope-sensitive permissions. Omit for scope-agnostic.
      responses:
        '200':
          description: Permission evaluation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  evaluatedAt:
                    type: string
                    format: date-time
                  results:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        allowed:
                          type: boolean
                        fromCache:
                          type: boolean
                        matchedAuthorizationId:
                          type: string
                          format: uuid
                          nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /permissions/effective:
    get:
      summary: Get all effective permissions for a user at an organizational scope (internal service)
      operationId: getEffectivePermissions
      tags: [Permissions]
      x-access: internal-service
      x-permissions-required:
        - iam.permission.view
      x-scope-sensitive: false
      description: |
        Called by domain services and the UI shell to initialize permission context
        on page/module load. Returns the full set of permissions a user holds at a
        given organizational scope, accounting for transitive authorization and MiLogin
        identity context. Scope-agnostic permissions are always included.
        Results derived from cached authorization data (5-minute TTL).
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: miLoginType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MiLoginType'
        - name: organizationCode
          in: query
          required: false
          description: |
            Scope to evaluate permissions against. Required for scope-sensitive
            permission resolution. Omit to return only scope-agnostic permissions.
          schema:
            type: string
      responses:
        '200':
          description: Effective permissions at the requested scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  organizationCode:
                    type: string
                    nullable: true
                  evaluatedAt:
                    type: string
                    format: date-time
                  fromCache:
                    type: boolean
                  permissions:
                    type: array
                    description: |
                      All permission IDs the user holds at this scope.
                      Consumers should treat this as the complete picture
                      for the given (userId, miLoginType, organizationCode)
                      combination at evaluation time.
                    items:
                      type: string
                      example: staffing.employee.view
                  grantedVia:
                    type: array
                    description: |
                      Authorizations that contributed permissions to this result,
                      useful for debugging and audit display.
                    items:
                      type: object
                      properties:
                        authorizationId:
                          type: string
                          format: uuid
                        scopeType:
                          $ref: '#/components/schemas/ScopeType'
                        scopeOrganizationCode:
                          type: string
                          nullable: true
                        isTransitive:
                          type: boolean
                          description: True if this authorization applies via hierarchy (not a direct match)
        '400':
          $ref: '#/components/responses/BadRequest'

  # ----------------------------------------------------------------------------
  # ROLES
  # ----------------------------------------------------------------------------

  /roles:
    get:
      summary: List all roles
      operationId: listRoles
      tags: [Roles]
      x-access: internal-user
      x-permissions-required:
        - iam.role.view
      x-scope-sensitive: false
      description: |
        Returns all role definitions. Scope is agnostic — roles are system-wide
        reference data; X-Organization-Context is not required.
      parameters:
        - name: applicableScopeType
          in: query
          description: Filter roles applicable to a specific scope type
          schema:
            $ref: '#/components/schemas/ScopeType'
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Paginated list of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /roles/{roleId}:
    get:
      summary: Get role details with permissions
      operationId: getRole
      tags: [Roles]
      x-access: internal-user
      x-permissions-required:
        - iam.role.view
      x-scope-sensitive: false
      description: |
        Returns full role definition including assigned permissions.
        Scope is resolved server-side from the role record — X-Organization-Context
        is not required.
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role details including permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # USERS
  # ----------------------------------------------------------------------------

  /users/search:
    get:
      summary: Search users (admin)
      operationId: searchUsers
      tags: [Users]
      x-access: internal-user
      x-permissions-required:
        - iam.user.view
      x-scope-sensitive: true
      description: |
        Returns users matching the search criteria within the organization specified
        by X-Organization-Context. Users with ISD-level authorization will see
        results for all constituent districts and buildings. Requires iam.user.view
        (System Admin only).
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: query
          in: query
          description: Search by name or email
          schema:
            type: string
        - name: miLoginType
          in: query
          schema:
            $ref: '#/components/schemas/MiLoginType'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated user search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}:
    get:
      summary: Get user details
      operationId: getUser
      tags: [Users]
      x-access: internal-user
      x-permissions-required:
        - iam.user.view
      x-scope-sensitive: false
      description: |
        Returns full user profile and authorization list. Scope is resolved
        server-side from the user record — X-Organization-Context is not required.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details and authorizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/by-unique-id/{uniqueId}:
    get:
      summary: Get user by Mi-Key Unique ID (internal service)
      operationId: getUserByUniqueId
      tags: [Users]
      x-access: internal-service
      x-permissions-required:
        - iam.user.view
      x-scope-sensitive: false
      description: |
        Called by other domain services (e.g., Staffing validating mentor assignment)
        to retrieve a user profile and active authorizations by Mi-Key Unique ID.
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - name: uniqueId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # ORGANIZATIONS
  # ----------------------------------------------------------------------------

  /organizations/search:
    get:
      summary: Typeahead search for organizations
      operationId: searchOrganizations
      tags: [Organizations]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.request
      x-scope-sensitive: false
      description: |
        Search organizations from the Organization Reference Data platform capability
        (CEDS-aligned replica synced from EEM). Used for authorization request forms
        and scope selectors. Sub-10ms response via local replica. Scope is agnostic —
        the full organization list is accessible to any authenticated user for
        request form purposes.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Partial name match (minimum 2 characters)
        - name: organizationType
          in: query
          schema:
            $ref: '#/components/schemas/OrganizationType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Matching organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSummary'

  /organizations/{organizationCode}:
    get:
      summary: Get organization details
      operationId: getOrganization
      tags: [Organizations]
      x-access: internal-user
      x-permissions-required:
        - iam.authorization.request
      x-scope-sensitive: false
      description: |
        Returns organization details including lead admin contact and parent hierarchy.
        Scope is resolved server-side from the organization record — X-Organization-Context
        is not required.
      parameters:
        - $ref: '#/components/parameters/OrganizationCode'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationCode}/hierarchy:
    get:
      summary: Get organization parent hierarchy (internal service)
      operationId: getOrganizationHierarchy
      tags: [Organizations]
      x-access: internal-service
      x-permissions-required:
        - iam.permission.view
      x-scope-sensitive: false
      description: |
        Called by the IAM permission evaluation engine to resolve transitive
        authorization scope. Returns the chain of parent organizations for a given
        organization code. Cached for 24 hours.
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - $ref: '#/components/parameters/OrganizationCode'
      responses:
        '200':
          description: Organization hierarchy chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationCode:
                    type: string
                  hierarchy:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSummary'
                    description: Ordered from immediate parent to root (e.g., District, ISD)
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # REPORTS (ADMIN)
  # ----------------------------------------------------------------------------

  /reports/new-users:
    get:
      summary: New user accounts report (admin)
