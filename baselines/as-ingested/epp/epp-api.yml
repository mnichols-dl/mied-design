          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /approval-application-reviews/{applicationId}/history:
    get:
      summary: Get approval application action history
      operationId: getApprovalApplicationHistory
      tags: [Approval Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.approvals.view
      x-scope-sensitive: false
      description: |
        Returns the full audit trail of actions taken on an approval application.
