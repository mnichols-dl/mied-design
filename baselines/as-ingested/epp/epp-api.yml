        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /approval-application-reviews/{applicationId}/deny:
    post:
      summary: Deny approval application
      operationId: denyApprovalApplication
      tags: [Approval Application Reviews]
