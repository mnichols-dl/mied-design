openapi: 3.0.3
info:
  title: MiEdWorkforce EPP API
  version: 1.0.0
  description: |
    Manages Educator Preparation Provider (EPP) registration, candidate enrollment
    tracking, and EPP review/recommendation workflows for credential applications.
    Primary consumers are EPP coordinators, MDE administrators, and internal domain
    services (Credentialing, Synapse pipelines).

servers:
  - url: http://epp-api.default.svc.cluster.local/api/v1
    description: Internal AKS cluster
  - url: https://api.miedworkforce.mi.gov/epp/api/v1
    description: External via APIM

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ----------------------------------------------------------------------------
  # EPP PROVIDER MANAGEMENT
  # ----------------------------------------------------------------------------

  /epp-providers:
    get:
      summary: List EPP providers
      operationId: listEppProviders
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.provider.view
      x-scope-sensitive: true
      description: |
        Returns EPP providers visible to the caller. Users with system-wide scope
        see all providers; users with EPP-specific scope see only their assigned
        provider(s). X-Organization-Context determines which EPP scope applies.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: eppType
          in: query
          schema:
            $ref: '#/components/schemas/EppType'
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Closed]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of EPP providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EppProviderSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Create EPP designation for EEM organization
      operationId: createEppProvider
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.provider.create
      x-scope-sensitive: false
      description: |
        Designates an existing EEM organization as an EPP. The organization must
        already exist in EEM before this endpoint is called. Restricted to users
        with system-wide scope (epp.admin.system or epp.provider.create at system level).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EppProviderCreate'
      responses:
        '201':
          description: EPP provider created
          content:
            application/json:
              schema:
                type: object
                properties:
                  eppCode:
                    type: string
                    description: Organization code from EEM
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /epp-providers/{eppCode}:
    get:
      summary: Get EPP provider details
      operationId: getEppProvider
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.provider.view
      x-scope-sensitive: false
      description: |
        Returns full EPP provider detail. Scope is resolved server-side from the
        provider's EPP code — X-Organization-Context is not required. Users with
        EPP-specific scope may only retrieve their own provider.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      responses:
        '200':
          description: EPP provider details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EppProviderDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update EPP provider configuration
      operationId: updateEppProvider
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.provider.edit
      x-scope-sensitive: false
      description: |
        Updates EPP-specific configuration such as contact info, eppType, and
        capability flags. Core organization data (name, address) is read-only here
        and must be updated in EEM directly.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EppProviderUpdate'
      responses:
        '200':
          description: EPP provider updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Deactivate EPP provider
      operationId: deactivateEppProvider
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.provider.delete
      x-scope-sensitive: false
      description: |
        Closes/deactivates an EPP provider. Blocked if active candidate enrollments
        exist. Restricted to system-wide scope only.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      responses:
        '204':
          description: EPP provider deactivated
        '400':
          description: Cannot deactivate — active enrollments exist
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # CERTIFICATE CATEGORIES
  # ----------------------------------------------------------------------------

  /epp-providers/{eppCode}/certificate-categories:
    post:
      summary: Add certificate category approval
      operationId: addCertificateCategory
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.certificatecategory.create
      x-scope-sensitive: false
      description: |
        Grants an EPP approval to offer a certificate type/pathway combination.
        Scope is resolved server-side from the eppCode path parameter.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateCategoryApproval'
      responses:
        '201':
          description: Certificate category added
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    put:
      summary: Update certificate category approval
      operationId: updateCertificateCategory
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.certificatecategory.edit
      x-scope-sensitive: false
      description: |
        Updates approval dates for an existing certificate category on this EPP.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CertificateCategoryApproval'
                - type: object
                  required: [categoryId]
                  properties:
                    categoryId:
                      type: string
                      format: uuid
      responses:
        '200':
          description: Certificate category updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Remove certificate category approval
      operationId: deleteCertificateCategory
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.certificatecategory.delete
      x-scope-sensitive: false
      description: |
        Removes a certificate category approval from this EPP. Blocked if active
        candidate enrollments exist under this category.
      parameters:
        - $ref: '#/components/parameters/EppCode'
        - name: categoryId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Certificate category deleted
        '400':
          description: Cannot delete — active candidate enrollments exist
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # ENDORSEMENTS
  # ----------------------------------------------------------------------------

  /epp-providers/{eppCode}/endorsements:
    post:
      summary: Add approved endorsement
      operationId: addEndorsement
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.endorsement.create
      x-scope-sensitive: false
      description: |
        Adds an approved endorsement to an EPP. The EPP must already hold approval
        for the associated certificate type before an endorsement can be added.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndorsementApproval'
      responses:
        '201':
          description: Endorsement added
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    put:
      summary: Update approved endorsement
      operationId: updateEndorsement
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.endorsement.edit
      x-scope-sensitive: false
      description: |
        Updates approval dates for an existing endorsement on this EPP.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EndorsementApproval'
                - type: object
                  required: [endorsementId]
                  properties:
                    endorsementId:
                      type: string
                      format: uuid
      responses:
        '200':
          description: Endorsement updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Remove approved endorsement
      operationId: deleteEndorsement
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.endorsement.delete
      x-scope-sensitive: false
      description: |
        Removes an approved endorsement from this EPP. Blocked if active candidates
        are pursuing this endorsement.
      parameters:
        - $ref: '#/components/parameters/EppCode'
        - name: endorsementId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Endorsement deleted
        '400':
          description: Cannot delete — active candidates pursuing endorsement
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # PRO PREP CONFIGURATION
  # ----------------------------------------------------------------------------

  /epp-providers/{eppCode}/proprepconfig:
    get:
      summary: Get Pro Prep catalog configuration
      operationId: getProprepConfig
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.proprepconfig.manage
      x-scope-sensitive: false
      description: |
        Returns Pro Prep catalog visibility configuration for this EPP. Scope is
        resolved server-side from the eppCode path parameter.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      responses:
        '200':
          description: Pro Prep configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProPrepConfig'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update Pro Prep catalog visibility
      operationId: updateProprepConfig
      tags: [EPP Providers]
      x-access: internal-user
      x-permissions-required:
        - epp.proprepconfig.manage
      x-scope-sensitive: false
      description: |
        Updates Pro Prep catalog visibility overrides, page text, and links for
        this EPP.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProPrepConfig'
      responses:
        '200':
          description: Pro Prep configuration updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # APPROVED PROGRAMS (internal-service projection)
  # ----------------------------------------------------------------------------

  /epp-providers/{eppCode}/approved-programs:
    get:
      summary: Get EPP approved programs (internal service)
      operationId: getApprovedPrograms
      tags: [EPP Providers]
      x-access: internal-service
      x-permissions-required:
        - epp.provider.view
      x-scope-sensitive: false
      description: |
        Called by the Credentialing domain to validate candidate program enrollment
        against the EPP's approved certificate categories and endorsements.
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      responses:
        '200':
          description: Approved programs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificateCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        certificateType:
                          type: string
                        pathway:
                          type: string
                        mdeApprovalDate:
                          type: string
                          format: date
                        enrollmentCloseDate:
                          type: string
                          format: date
                        recommendCloseDate:
                          type: string
                          format: date
                  endorsements:
                    type: array
                    items:
                      type: object
                      properties:
                        endorsementCode:
                          type: string
                        certificateType:
                          type: string
                        gradeBand:
                          $ref: '#/components/schemas/GradeBand'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # PRO PREP PUBLIC CATALOG (Unauthenticated via APIM)
  # ----------------------------------------------------------------------------

  /pro-prep/providers/search:
    get:
      summary: Search public Pro Prep provider catalog
      operationId: searchProPrepProviders
      tags: [Pro Prep Catalog]
      x-access: external-public
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Unauthenticated public endpoint routed via APIM (FDD 31.4 "Public Search -
        Pro Prep"). No X-Organization-Context applies.
        Returns only Active providers, filtered further to certificate categories/
        endorsements currently visible per the "Pro Prep Visibility Based on Close
        Dates" rule (epp-domain.md) — i.e. today is before both Enrollment Close Date
        and Recommend Close Date. Free-text providerName match is full/partial,
        leading/trailing-space-stripped, embedded-space-retained.
        Does not return City or Website — see epp-domain.md Open Question (Coverage
        Gap: neither field is modeled anywhere in the EPP domain or the Organizations
        capability today).
      parameters:
        - name: providerName
          in: query
          schema:
            type: string
        - name: programType
          in: query
          schema:
            type: string
          description: Matches a certificateType within the provider's visible certificateCategories
        - name: pathway
          in: query
          schema:
            type: string
        - name: eppType
          in: query
          schema:
            $ref: '#/components/schemas/EppType'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated public provider search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicProviderSearchResult'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /pro-prep/providers/{eppCode}:
    get:
      summary: Get public Pro Prep provider detail
      operationId: getProPrepProviderDetail
      tags: [Pro Prep Catalog]
      x-access: external-public
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Unauthenticated public endpoint routed via APIM. Returns provider contact
        information and the list of currently-visible programs (certificate
        categories/endorsements), filtered the same way as
        /pro-prep/providers/search. Returns 404 if the provider is not Active or has
        no currently-visible programs.
      parameters:
        - $ref: '#/components/parameters/EppCode'
      responses:
        '200':
          description: Public provider detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProviderDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # CANDIDATE ENROLLMENTS
  # ----------------------------------------------------------------------------

  /candidate-enrollments:
    get:
      summary: Search candidate enrollments
      operationId: searchCandidateEnrollments
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.view
      x-scope-sensitive: true
      description: |
        Returns candidate enrollments within the caller's EPP scope as determined
        by X-Organization-Context. EPP coordinators see only their own EPP's
        enrollments. Users with system-wide authorization see all enrollments and
        may filter by eppCode. The allEpps and candidateId parameters allow
        cross-EPP enrollment history lookup for admin users.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EnrollmentStatus'
        - name: programLevel
          in: query
          schema:
            type: string
        - name: programType
          in: query
          schema:
            type: string
        - name: firstName
          in: query
          schema:
            type: string
        - name: lastName
          in: query
          schema:
            type: string
        - name: studentId
          in: query
          schema:
            type: string
        - name: uniqueId
          in: query
          schema:
            type: string
        - name: eppCode
          in: query
          schema:
            type: string
          description: Filter by specific EPP — admin only
        - name: candidateId
          in: query
          schema:
            type: string
          description: Get all enrollments for a candidate across EPPs
        - name: allEpps
          in: query
          schema:
            type: boolean
          description: Show cross-EPP enrollment history for a candidate — admin only
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of candidate enrollments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CandidateEnrollmentSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /candidate-enrollments/bulk-accept:
    post:
      summary: Accept pending enrollment verifications (bulk)
      operationId: bulkAcceptEnrollments
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.verify
      x-scope-sensitive: false
      description: |
        Transitions multiple candidate enrollments from PendingVerification to
        Enrolled. Scope is resolved server-side — each candidateId is validated
        against the caller's assigned EPP. Returns per-candidate errors for any
        records that could not be accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateIds, enrollmentDate, programLevel]
              properties:
                candidateIds:
                  type: array
                  items:
                    type: string
                  description: Candidate enrollment IDs to accept
                enrollmentDate:
                  type: string
                  format: date
                programLevel:
                  type: string
                  description: Teacher, CTE, School Administrator, etc.
                programType:
                  type: string
                  description: Required for Teacher and School Administrator levels
      responses:
        '200':
          description: Bulk accept completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  acceptedCount:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        candidateId:
                          type: string
                        error:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /candidate-enrollments/bulk-reject:
    post:
      summary: Reject pending enrollment verifications (bulk)
      operationId: bulkRejectEnrollments
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.verify
      x-scope-sensitive: false
      description: |
        Transitions multiple candidate enrollments from PendingVerification to
        Rejected. Scope is resolved server-side against the caller's assigned EPP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateIds]
              properties:
                candidateIds:
                  type: array
                  items:
                    type: string
                  description: Candidate enrollment IDs to reject
      responses:
        '200':
          description: Bulk reject completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejectedCount:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /candidate-enrollments/bulk-status-update:
    patch:
      summary: Update status for multiple candidates (bulk)
      operationId: bulkUpdateCandidateStatus
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.edit
      x-scope-sensitive: false
      description: |
        Updates enrollment status for multiple candidates in a single call.
        Scope is resolved server-side — each candidateId is validated against the
        caller's assigned EPP. Returns per-candidate errors for invalid transitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateIds, status]
              properties:
                candidateIds:
                  type: array
                  items:
                    type: string
                status:
                  $ref: '#/components/schemas/EnrollmentStatus'
                exitDate:
                  type: string
                  format: date
                exitReason:
                  type: string
                enrollmentDate:
                  type: string
                  format: date
                programLevel:
                  type: string
                programType:
                  type: string
      responses:
        '200':
          description: Bulk status update completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        candidateId:
                          type: string
                        error:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /candidate-enrollments/bulk-upload/initiate:
    post:
      summary: Initiate bulk candidate tracking upload
      operationId: initiateBulkUpload
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.bulk-upload
      x-scope-sensitive: false
      description: |
        Uploads a CSV file to staging and kicks off an async Synapse pipeline
        to process enrollment records. Returns a jobId and statusUrl to poll
        for completion. Scope is resolved server-side from the eppCode in the
        request body.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, eppCode]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with candidate tracking data
                eppCode:
                  type: string
      responses:
        '202':
          description: Upload accepted — processing asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  bulkUploadJobId:
                    type: string
                    format: uuid
                  statusUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /candidate-enrollments/bulk-upload/complete:
    post:
      summary: Complete bulk upload job (called by Synapse)
      operationId: completeBulkUpload
      tags: [Candidate Enrollments]
      x-access: internal-service
      x-permissions-required:
        - epp.enrollment.bulk-upload
      x-scope-sensitive: false
      description: |
        Called by the Synapse pipeline to report final status of a bulk upload job.
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bulkUploadJobId, status]
              properties:
                bulkUploadJobId:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [Success, PartialSuccess, Failed]
                processedCount:
                  type: integer
                errorCount:
                  type: integer
                errorReportUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Bulk upload job completed
        '404':
          $ref: '#/components/responses/NotFound'

  /candidate-enrollments/bulk-create:
    post:
      summary: Create/update enrollments from bulk file (called by Synapse)
      operationId: bulkCreateEnrollments
      tags: [Candidate Enrollments]
      x-access: internal-service
      x-permissions-required:
        - epp.enrollment.edit
      x-scope-sensitive: false
      description: |
        Called by the Synapse pipeline to apply parsed enrollment records from a
        bulk upload file. Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bulkUploadJobId, enrollments]
              properties:
                bulkUploadJobId:
                  type: string
                  format: uuid
                enrollments:
                  type: array
                  items:
                    type: object
                    required: [candidateUniqueId, eppCode, status]
                    properties:
                      candidateUniqueId:
                        type: string
                      eppCode:
                        type: string
                      studentId:
                        type: string
                      status:
                        $ref: '#/components/schemas/EnrollmentStatus'
                      programLevel:
                        type: string
                      programType:
                        type: string
                      enrollmentDate:
                        type: string
                        format: date
                      exitDate:
                        type: string
                        format: date
                      exitReason:
                        type: string
      responses:
        '200':
          description: Enrollments created/updated
        '400':
          $ref: '#/components/responses/BadRequest'

  /candidate-enrollments/{enrollmentId}:
    get:
      summary: Get candidate enrollment details
      operationId: getCandidateEnrollment
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.view
      x-scope-sensitive: false
      description: |
        Returns full enrollment detail for a single candidate. Scope is resolved
        server-side from the enrollment's owning EPP — X-Organization-Context is
        not required.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Candidate enrollment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateEnrollmentDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update candidate enrollment status
      operationId: updateCandidateStatus
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.edit
      x-scope-sensitive: false
      description: |
        Updates the enrollment status of a candidate. Required fields vary by
        target status (e.g. exitDate/exitReason required when transitioning to
        Exited; enrollmentDate/programLevel required when transitioning from
        Rejected to Enrolled). Scope is resolved server-side from the enrollment's
        owning EPP.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/EnrollmentStatus'
                exitDate:
                  type: string
                  format: date
                  description: Required when status is Exited
                exitReason:
                  type: string
                  description: Required when status is Exited
                enrollmentDate:
                  type: string
                  format: date
                  description: Required when transitioning from Rejected to Enrolled
                programLevel:
                  type: string
                  description: Required when transitioning from Rejected to Enrolled
                programType:
                  type: string
                  description: Required for Teacher/Admin when transitioning from Rejected to Enrolled
      responses:
        '200':
          description: Status updated
        '400':
          description: Invalid status transition or missing required fields
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /candidate-enrollments/{enrollmentId}/programs:
    get:
      summary: Get candidate program assignments
      operationId: getCandidatePrograms
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.view
      x-scope-sensitive: false
      description: |
        Returns the program assignments for a candidate enrollment. Scope is
        resolved server-side from the enrollment's owning EPP.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Program assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentProgram'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Add program to candidate enrollment
      operationId: addCandidateProgram
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.edit
      x-scope-sensitive: false
      description: |
        Adds a program assignment to an existing candidate enrollment. The program
        must be within the EPP's approved program set. Scope is resolved server-side
        from the enrollment's owning EPP.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [program, gradeBand]
              properties:
                program:
                  type: string
                  description: General/Special Ed or CTE program name
                gradeBand:
                  $ref: '#/components/schemas/GradeBand'
      responses:
        '201':
          description: Program added
        '400':
          description: Duplicate program or program not approved for EPP
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update candidate program
      operationId: updateCandidateProgram
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.edit
      x-scope-sensitive: false
      description: |
        Updates the grade band for an existing program assignment on a candidate
        enrollment. Scope is resolved server-side from the enrollment's owning EPP.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programId, gradeBand]
              properties:
                programId:
                  type: string
                  format: uuid
                gradeBand:
                  $ref: '#/components/schemas/GradeBand'
      responses:
        '200':
          description: Program updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Remove program from candidate enrollment
      operationId: deleteCandidateProgram
      tags: [Candidate Enrollments]
      x-access: internal-user
      x-permissions-required:
        - epp.enrollment.edit
      x-scope-sensitive: false
      description: |
        Removes a program assignment from a candidate enrollment. Blocked if this
        is the last program on an enrollment in a status that requires at least
        one program.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: programId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Program deleted
        '400':
          description: Cannot delete — last program for a status that requires programs
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # CANDIDATE ENROLLMENT STATUS (internal-service projection)
  # ----------------------------------------------------------------------------

  /candidates/{candidateId}/enrollment-status:
    get:
      summary: Get candidate enrollment verification status (internal service)
      operationId: getCandidateEnrollmentStatus
      tags: [Candidate Enrollments]
      x-access: internal-service
      x-permissions-required:
        - epp.enrollment.view
      x-scope-sensitive: false
      description: |
        Called by the Credentialing domain to validate that a candidate holds an
        active EPP enrollment before processing a credential application.
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
          description: Unique ID or internal candidate ID
      responses:
        '200':
          description: Enrollment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasActiveEnrollment:
                    type: boolean
                  enrollments:
                    type: array
                    items:
                      type: object
                      properties:
                        eppCode:
                          type: string
                        eppName:
                          type: string
                        status:
                          $ref: '#/components/schemas/EnrollmentStatus'
                        programLevel:
                          type: string
                        programType:
                          type: string
                        enrollmentDate:
                          type: string
                          format: date
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # CREDENTIAL APPLICATION REVIEWS
  # ----------------------------------------------------------------------------

  /application-reviews:
    get:
      summary: Search credential applications for EPP review
      operationId: searchApplicationReviews
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.view
      x-scope-sensitive: true
      description: |
        Returns credential applications requiring EPP review within the caller's
        EPP scope as determined by X-Organization-Context. EPP coordinators see
        only applications routed to their EPP. Users with system-wide authorization
        may filter by eppCode.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: status
          in: query
          schema:
            type: string
            enum: [Submitted, Hold, Denied, Cancelled, Recommended]
        - name: certificateType
          in: query
          schema:
            type: string
        - name: applicationNumber
          in: query
          schema:
            type: string
        - name: firstName
          in: query
          schema:
            type: string
        - name: lastName
          in: query
          schema:
            type: string
        - name: uniqueId
          in: query
          schema:
            type: string
        - name: studentId
          in: query
          schema:
            type: string
        - name: hasConviction
          in: query
          schema:
            type: boolean
        - name: usesAlternativePass
          in: query
          schema:
            type: boolean
          description: Applies to Teacher applications only
        - name: eppCode
          in: query
          schema:
            type: string
          description: Filter by EPP — auto-set for coordinators, admin only for overrides
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of credential application reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationReviewSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /application-reviews/{applicationId}:
    get:
      summary: Get credential application review details
      operationId: getApplicationReview
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.view
      x-scope-sensitive: false
      description: |
        Returns full detail for a single credential application review. Scope is
        resolved server-side from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application review details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationReviewDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /application-reviews/{applicationId}/hold:
    post:
      summary: Place application on hold
      operationId: holdApplication
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.review
      x-scope-sensitive: false
      description: |
        Transitions a credential application from Submitted to Hold. Requires
        external remarks visible to the candidate. Scope is resolved server-side
        from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationRemarks]
              properties:
                applicationRemarks:
                  type: string
                  description: External remarks visible to candidate
                internalRemarks:
                  type: string
                  description: Internal EPP notes
      responses:
        '200':
          description: Application placed on hold
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /application-reviews/{applicationId}/deny:
    post:
      summary: Deny credential application
      operationId: denyApplication
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.review
      x-scope-sensitive: false
      description: |
        Transitions a credential application to Denied. Requires external remarks.
        Scope is resolved server-side from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationRemarks]
              properties:
                applicationRemarks:
                  type: string
                internalRemarks:
                  type: string
      responses:
        '200':
          description: Application denied
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /application-reviews/{applicationId}/cancel:
    post:
      summary: Cancel application review
      operationId: cancelApplication
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.review
      x-scope-sensitive: false
      description: |
        Transitions a credential application to Cancelled. Requires external remarks.
        Scope is resolved server-side from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationRemarks]
              properties:
                applicationRemarks:
                  type: string
                internalRemarks:
                  type: string
      responses:
        '200':
          description: Application cancelled
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /application-reviews/{applicationId}/recommend:
    post:
      summary: Recommend candidate for credential
      operationId: recommendApplication
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.recommend
      x-scope-sensitive: false
      description: |
        Transitions a credential application to Recommended. Each recommended
        endorsement must have a passing MTTC result and must be within the EPP's
        approved endorsement scope. Note: epp.applications.recommend is separated
        from epp.applications.review to support dual-approval workflows. Scope is
        resolved server-side from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendedEndorsements]
              properties:
                recommendedEndorsements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [endorsementCode, gradeBand]
                    properties:
                      endorsementCode:
                        type: string
                      gradeBand:
                        $ref: '#/components/schemas/GradeBand'
                internalRemarks:
                  type: string
      responses:
        '200':
          description: Application recommended
        '400':
          description: Validation error — MTTC not passed, endorsement not in EPP scope, etc.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /application-reviews/{applicationId}/internal-remarks:
    get:
      summary: Get internal remarks history
      operationId: getInternalRemarks
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.view
      x-scope-sensitive: false
      description: |
        Returns all internal remarks logged against a credential application.
        Scope is resolved server-side from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Internal remarks list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    remarkId:
                      type: string
                      format: uuid
                    remarkText:
                      type: string
                    createdBy:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Add internal remark
      operationId: addInternalRemark
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.review
      x-scope-sensitive: false
      description: |
        Appends an internal remark to a credential application. Internal remarks
        are not visible to the candidate. Scope is resolved server-side from the
        application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarkText]
              properties:
                remarkText:
                  type: string
      responses:
        '201':
          description: Internal remark added
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /application-reviews/{applicationId}/remarks-history:
    get:
      summary: Get application review action history
      operationId: getRemarksHistory
      tags: [Application Reviews]
      x-access: internal-user
      x-permissions-required:
        - epp.applications.view
      x-scope-sensitive: false
      description: |
        Returns the full audit trail of review actions (Hold, Deny, Cancel,
        Recommend) taken on a credential application. Scope is resolved
        server-side from the application's owning EPP.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Review action history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    action:
                      type: string
                      enum: [Hold, Deny, Cancel, Recommend]
                    applicationRemarks:
                      type: string
                    internalRemarks:
                      type: string
                    actionBy:
                      type: string
                    actionAt:
                      type: string
                      format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
