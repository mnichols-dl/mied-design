openapi: 3.0.3
info:
  title: MiEdWorkforce Documents API
  version: 1.0.0
  description: |
    Centralized file storage and lifecycle management infrastructure providing
    secure document uploads, version control, malware scanning, retention policies,
    and bulk file operations across all MiEdWorkforce domains.

    ## Authentication

    This API has two distinct caller types:

    **Internal service calls (infrastructure endpoints):** Upload, download, replacement,
    bulk upload, and staging endpoints are called by domain APIs on behalf of authenticated
    users, not directly by browsers or end users. These endpoints are secured via Azure
    Managed Identity at the network/platform level. Domain APIs are responsible for all
    business-level authorization before calling Documents. Documents validates technical
    constraints only (file type, size, category rules).

    **Direct user calls (admin capability endpoints):** Legal hold, retention override,
    category management, audit, and bulk delete endpoints are called directly from the
    Documents admin UI by authenticated users. These endpoints require a valid MiLogin
    session and enforce Documents-owned permissions.

servers:
  - url: http://documents-api.default.svc.cluster.local/api/v1
    description: Internal AKS cluster
  - url: https://api.miedworkforce.mi.gov/documents/api/v1
    description: External via APIM

paths:

  # ============================================================================
  # DOCUMENT UPLOAD
  # Internal service endpoints — called by domain APIs, not directly by users.
  # Authorization for the underlying action is enforced by the calling domain.
  # ============================================================================

  /documents/upload/request:
    post:
      summary: Request upload SAS token for document
      operationId: requestDocumentUpload
      tags: [Documents]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Called by domain APIs after verifying the user is authorized to perform
        the action requiring this upload. Documents validates technical constraints
        only (file type, format, size against category limits).

        Generates a write-only SAS token for browser-based direct upload to blob
        storage. Creates document record with status=Scanning.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, fileSize, mimeType, category, attachmentType, attachmentId]
              properties:
                filename:
                  type: string
                  maxLength: 255
                  description: Original filename (will be sanitized for blob storage)
                fileSize:
                  type: integer
                  description: File size in bytes
                mimeType:
                  type: string
                  description: MIME type (e.g., application/pdf, image/jpeg)
                category:
                  type: string
                  description: Document category slug determining storage, retention, and format rules
                  example: credential-supporting-docs
                attachmentType:
                  type: string
                  description: Type of business entity this document is attached to
                  example: application
                attachmentId:
                  type: string
                  description: ID of the business entity document is attached to
      responses:
        '200':
          description: Upload SAS token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
                    format: uri
                    description: Write-only SAS URL (15 min expiry). Upload directly from browser.
                  status:
                    type: string
                    enum: [Scanning]
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'

  /documents/{documentId}/download:
    get:
      summary: Generate download SAS token for document
      operationId: downloadDocument
      tags: [Documents]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Called by domain APIs to retrieve a time-limited download URL for a document.
        The calling domain is responsible for verifying the user may access this document
        before requesting a token. Documents does not re-check business authorization.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Download SAS token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  sasUrl:
                    type: string
                    format: uri
                    description: Read-only SAS URL (15 min expiry)
                  originalFilename:
                    type: string
                  fileSize:
                    type: integer
                  mimeType:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '202':
          description: Document still scanning — retry shortly
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [Scanning]
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Document has been soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /documents/{documentId}/replace/request:
    post:
      summary: Request upload SAS token for document replacement
      operationId: requestDocumentReplacement
      tags: [Documents]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Called by domain APIs to replace an existing document with a new version.
        The calling domain is responsible for verifying the user may replace this
        document. Documents enforces technical constraints only: maximum 10 versions,
        document must not be soft-deleted, file type and size must be within category limits.

        Archives the current version, creates a new document record, and returns a
        write-only SAS token for the replacement upload.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, fileSize, mimeType]
              properties:
                filename:
                  type: string
                  maxLength: 255
                fileSize:
                  type: integer
                mimeType:
                  type: string
      responses:
        '200':
          description: Replacement upload SAS token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  newDocumentId:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
                    format: uri
                  versionNumber:
                    type: number
                    format: decimal
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Cannot replace — max versions reached, document is soft-deleted, or file type/size invalid
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}:
    get:
      summary: Get document metadata
      operationId: getDocumentMetadata
      tags: [Documents]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Returns document metadata. Called by domain APIs to check document status
        or retrieve metadata for display. Does not generate a download URL.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadata'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Soft delete document
      operationId: softDeleteDocument
      tags: [Documents]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Marks document as soft-deleted (hidden from users). Hard delete occurs
        automatically after retention period expires via nightly job.

        Called by domain APIs. Domain APIs are responsible for verifying the user
        may delete this document before calling. Documents enforces that legal holds
        block deletion.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                    format: uuid
                  retentionExpiryDate:
                    type: string
                    format: date
                    description: Eligible for hard delete after this date
        '403':
          description: Cannot delete — document has an active legal hold
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/search:
    get:
      summary: Search documents by attachment or category
      operationId: searchDocuments
      tags: [Documents]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Returns documents matching the given filters. Used by domain APIs to retrieve
        documents for a given attachment context, and by the Documents admin UI for
        legal hold and override workflows.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - name: attachmentType
          in: query
          schema:
            type: string
        - name: attachmentId
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: uploadedAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Document search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  # ============================================================================
  # BULK OPERATIONS
  # Internal service endpoints — called by domain APIs, not directly by users.
  # Bulk vs. single upload is a UX distinction only; no separate permission applies.
  # ============================================================================

  /documents/bulk-upload/request:
    post:
      summary: Initiate bulk document upload
      operationId: initiateBulkUpload
      tags: [BulkOperations]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Called by domain APIs to initiate a batch upload on behalf of a user.
        Functionally identical to single upload in terms of authorization — if the
        user is permitted to upload a document for a given purpose, they are permitted
        to upload multiple. The calling domain authorizes the action; Documents handles
        mechanics only.

        Creates a BulkOperation record, validates all files against category rules,
        and returns individual upload SAS tokens for each file. Each file is scanned
        independently; partial failure is permitted.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, category, attachmentType, attachmentId]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [filename, fileSize, mimeType]
                    properties:
                      filename:
                        type: string
                      fileSize:
                        type: integer
                      mimeType:
                        type: string
                category:
                  type: string
                attachmentType:
                  type: string
                attachmentId:
                  type: string
      responses:
        '200':
          description: Bulk upload operation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                    format: uuid
                  uploadUrls:
                    type: array
                    items:
                      type: object
                      properties:
                        documentId:
                          type: string
                          format: uuid
                        uploadUrl:
                          type: string
                          format: uri
                        filename:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /documents/bulk-delete:
    post:
      summary: Bulk soft delete documents with retention validation
      operationId: bulkDeleteDocuments
      tags: [BulkOperations]
      x-access: internal-user
      x-permissions-required:
        - documents.admin.bulk-delete
      x-scope-sensitive: false
      description: |
        Validates retention policies and legal holds for all documents before
        starting. Permissive mode (default) skips ineligible documents and
        proceeds with eligible ones. Strict mode blocks the entire operation
        if any document is ineligible.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              properties:
                documentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                mode:
                  type: string
                  enum: [permissive, strict]
                  default: permissive
                  description: |
                    permissive: Skip ineligible documents, delete eligible ones.
                    strict: Block entire operation if any document is ineligible.
      responses:
        '200':
          description: Bulk delete operation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                    format: uuid
                  succeededCount:
                    type: integer
                  skippedCount:
                    type: integer
                  skippedDocuments:
                    type: array
                    items:
                      type: object
                      properties:
                        documentId:
                          type: string
                          format: uuid
                        skipReason:
                          type: string
                          enum: [legal_hold, retention_not_expired]
        '400':
          description: Strict mode — one or more documents are ineligible for deletion
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents/bulk-operations/{operationId}:
    get:
      summary: Get bulk operation status
      operationId: getBulkOperationStatus
      tags: [BulkOperations]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Returns current status and per-item results for a bulk upload or delete operation.
        Used by both domain UIs (polling upload progress) and the Documents admin UI.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bulk operation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # STAGING AREA (for Synapse processing)
  # Internal service endpoint — called by domain APIs, not directly by users.
  # ============================================================================

  /documents/staging/upload/request:
    post:
      summary: Upload file to staging area for Synapse pipeline processing
      operationId: uploadToStaging
      tags: [Staging]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Called by domain APIs to stage a bulk import file (CSV/XLSX) for downstream
        Synapse pipeline processing. The calling domain is responsible for authorizing
        the upload action. Documents validates file format and size only.

        Files are scanned for malware on upload. A BulkFileUploaded event is published
        on clean scan, triggering the appropriate Synapse pipeline. Staged blobs are
        automatically deleted after 7 days regardless of processing status.

        Internal service endpoint — called by domain APIs via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, fileSize, mimeType, functionalArea, importType]
              properties:
                filename:
                  type: string
                fileSize:
                  type: integer
                  maximum: 524288000
                  description: Max 500 MB
                mimeType:
                  type: string
                  enum:
                    - text/csv
                    - application/vnd.ms-excel
                    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                functionalArea:
                  type: string
                  enum: [staffing, epp, proflearning]
                importType:
                  type: string
                  description: Import type identifier (e.g., employee_roster, candidate_enrollment)
      responses:
        '200':
          description: Staging upload SAS token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
                    format: uri
                  status:
                    type: string
                    enum: [Scanning]
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================================
  # LEGAL HOLD MANAGEMENT
  # Admin capability endpoints — called directly from Documents admin UI.
  # ============================================================================

  /documents/legal-hold/apply:
    post:
      summary: Apply legal hold to documents
      operationId: applyLegalHold
      tags: [LegalHold]
      x-access: internal-user
      x-permissions-required:
        - documents.legal-hold.apply
      x-scope-sensitive: false
      description: |
        Applies a legal hold to one or more documents, preventing hard delete
        regardless of retention policy. Requires case number and justification
        for audit trail.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds, justification, caseNumber]
              properties:
                documentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                justification:
                  type: string
                  maxLength: 2000
                caseNumber:
                  type: string
                holdReason:
                  type: string
                  enum: [litigation, investigation, audit, compliance]
      responses:
        '200':
          description: Legal hold applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  appliedCount:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents/legal-hold/release:
    post:
      summary: Release legal hold from documents
      operationId: releaseLegalHold
      tags: [LegalHold]
      x-access: internal-user
      x-permissions-required:
        - documents.legal-hold.release
      x-scope-sensitive: false
      description: |
        Releases a legal hold from one or more documents. Documents become eligible
        for hard delete if their retention period has also expired. Releasing a hold
        does not immediately delete documents.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds, releaseReason]
              properties:
                documentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                releaseReason:
                  type: string
                  maxLength: 2000
                caseClosureDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Legal hold released
          content:
            application/json:
              schema:
                type: object
                properties:
                  releasedCount:
                    type: integer
        '400':
          description: Release reason is required
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================================
  # RETENTION OVERRIDE REQUESTS
  # Admin capability endpoints — called directly from Documents admin UI.
  # ============================================================================

  /documents/override-requests:
    post:
      summary: Request retention policy override
      operationId: requestRetentionOverride
      tags: [RetentionOverride]
      x-access: internal-user
      x-permissions-required:
        - documents.retention-override.request
      x-scope-sensitive: false
      description: |
        Submits a request to delete documents before their retention expiry or
        despite an active legal hold. Requires business justification. High-value
        documents (legal hold history or >5 year retention) require dual approval.
        Approved overrides expire if not executed within 7 days.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds, justification, businessReason]
              properties:
                documentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                justification:
                  type: string
                  maxLength: 2000
                businessReason:
                  type: string
                  enum: [gdpr_request, legal_mandate, storage_emergency, data_correction]
                urgency:
                  type: string
                  enum: [low, medium, high, critical]
      responses:
        '201':
          description: Override request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [Pending]
                  approvalsRequired:
                    type: integer
                    description: 1 for standard documents, 2 for high-value documents
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: List retention override requests
      operationId: listOverrideRequests
      tags: [RetentionOverride]
      x-access: internal-user
      x-permissions-required:
        - documents.retention-override.request
        - documents.retention-override.approve
      x-scope-sensitive: false
      description: |
        Returns override requests, optionally filtered by status. Accessible to
        users holding either the request or approve permission.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Pending, Approved, Rejected, Executed, Expired]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Override request list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverrideRequestSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /documents/override-requests/{requestId}:
    get:
      summary: Get override request details
      operationId: getOverrideRequest
      tags: [RetentionOverride]
      x-access: internal-user
      x-permissions-required:
        - documents.retention-override.request
        - documents.retention-override.approve
      x-scope-sensitive: false
      description: |
        Returns full details of an override request including document list and
        retention information. Used by approvers reviewing the request. Accessible
        to users holding either the request or approve permission.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Override request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideRequestDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/override-requests/{requestId}/approve:
    post:
      summary: Approve override request
      operationId: approveOverrideRequest
      tags: [RetentionOverride]
      x-access: internal-user
      x-permissions-required:
        - documents.retention-override.approve
      x-scope-sensitive: false
      description: |
        Records an approval for an override request. If sufficient approvals have
        been received the request transitions to Approved status and the requester
        is notified. For dual-approval requests the status remains Pending until
        the second approval is received.

        Approvers cannot approve their own requests.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalComments:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Approval recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [Approved, Pending]
                    description: Approved if sufficient approvals received; Pending if awaiting second approval
                  approvalsReceived:
                    type: integer
        '403':
          description: Forbidden — insufficient permissions or approver is the same as requester
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/override-requests/{requestId}/execute:
    post:
      summary: Execute approved override
      operationId: executeOverrideRequest
      tags: [RetentionOverride]
      x-access: internal-user
      x-permissions-required:
        - documents.retention-override.request
      x-scope-sensitive: false
      description: |
        Performs soft delete for all documents in an approved override request,
        bypassing retention policy checks. Must be executed within 7 days of
        approval or the request expires and a new request must be submitted.

        Requester executes their own approved request. This action is irreversible.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Override executed — documents soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
        '400':
          description: Override has expired or has not been approved
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Override has already been executed

  # ============================================================================
  # DOCUMENT CATEGORY MANAGEMENT
  # Admin capability endpoints — called directly from Documents admin UI.
  # ============================================================================

  /documents/categories:
    get:
      summary: List document categories
      operationId: listDocumentCategories
      tags: [CategoryManagement]
      x-access: internal-user
      x-permissions-required:
        - documents.category.view
      x-scope-sensitive: false
      description: |
        Returns all document category configurations.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentCategorySummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Create document category
      operationId: createDocumentCategory
      tags: [CategoryManagement]
      x-access: internal-user
      x-permissions-required:
        - documents.category.create
      x-scope-sensitive: false
      description: |
        Creates a new document category. The blob container name is derived
        automatically from the category slug.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryId:
                    type: string
                    format: uuid
                  categorySlug:
                    type: string
                  blobContainerName:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents/categories/{categorySlug}:
    get:
      summary: Get document category details
      operationId: getDocumentCategory
      tags: [CategoryManagement]
      x-access: internal-user
      x-permissions-required:
        - documents.category.view
      x-scope-sensitive: false
      description: |
        Returns full configuration for a single document category.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - $ref: '#/components/parameters/CategorySlug'
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCategoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update document category configuration
      operationId: updateDocumentCategory
      tags: [CategoryManagement]
      x-access: internal-user
      x-permissions-required:
        - documents.category.edit
      x-scope-sensitive: false
      description: |
        Modifies category display name, allowable formats, or file size limit.
        Retention period and storage tier changes are managed via infrastructure-as-code
        and are not exposed here.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - $ref: '#/components/parameters/CategorySlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                description:
                  type: string
                allowableFormats:
                  type: array
                  items:
                    type: string
                  description: Whitelist of permitted MIME types
                fileSizeLimitMb:
                  type: integer
                  minimum: 1
                  maximum: 500
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCategoryDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/categories/{categorySlug}/deprecate:
    post:
      summary: Deprecate document category
      operationId: deprecateDocumentCategory
      tags: [CategoryManagement]
      x-access: internal-user
      x-permissions-required:
        - documents.category.deprecate
      x-scope-sensitive: false
      description: |
        Marks a category as deprecated — no new uploads are permitted, but existing
        documents remain accessible. Cannot be reversed via API.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - $ref: '#/components/parameters/CategorySlug'
      responses:
        '200':
          description: Category deprecated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # AUDIT AND REPORTING
  # Admin capability endpoints — called directly from Documents admin UI.
  # ============================================================================

  /documents/audit/logs:
    get:
      summary: View document access and lifecycle audit logs
      operationId: getAuditLogs
      tags: [Audit]
      x-access: internal-user
      x-permissions-required:
        - documents.audit.view
      x-scope-sensitive: false
      description: |
        Returns document access logs filtered by document, user, action, or date range.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      parameters:
        - name: documentId
          in: query
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            enum: [view, download, upload, replace, delete]
        - name: after
          in: query
          schema:
            type: string
            format: date-time
        - name: before
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents/audit/logs/export:
    post:
      summary: Export audit log data
      operationId: exportAuditLogs
      tags: [Audit]
      x-access: internal-user
      x-permissions-required:
        - documents.audit.export
      x-scope-sensitive: false
      description: |
        Initiates an async export of audit log data for compliance reporting.
        Returns a job ID; poll the status endpoint for completion and download URL.

        Admin capability endpoint — called directly from the Documents admin UI.
      security:
        - MiLogin: [documents:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [csv, xlsx]
                  default: csv
                after:
                  type: string
                  format: date-time
                before:
                  type: string
                  format: date-time
                documentId:
                  type: string
                  format: uuid
                userId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Export initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  statusUrl:
                    type: string
                    format: uri
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================================
  # WEBHOOKS (Azure Event Grid — not called by users or services)
  # ============================================================================

  /webhooks/defender-scan-result:
    post:
      summary: Receive Azure Defender malware scan result
      operationId: receiveScanResult
      tags: [Webhooks]
      x-access: internal-service
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Called by Azure Event Grid with malware scan results from Azure Defender
        for Storage. Updates document status based on scan outcome.

        Not a user-facing or domain-service endpoint. Secured via Event Grid
        webhook signature validation rather than Managed Identity or MiLogin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  eventType:
                    type: string
                  subject:
                    type: string
                  data:
                    type: object
                    properties:
                      blobUri:
                        type: string
                      scanResultType:
                        type: string
                        enum: [No threats found, Malicious, Error, Not scanned]
                      scanResultDetails:
                        type: object
                        properties:
                          malwareNamesFound:
                            type: array
                            items:
                              type: string
      responses:
        '200':
          description: Webhook received and processed
        '400':
          description: Invalid webhook payload

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CategorySlug:
      name: categorySlug
      in: path
      required: true
      schema:
        type: string
      description: URL-safe category identifier (e.g., credential-supporting-docs)

  schemas:
    DocumentStatus:
      type: string
      enum:
        - Uploading
        - Scanning
        - Available
        - Infected
        - Scan Failed
        - Soft Deleted
        - Hard Deleted
        - Archived

    DocumentMetadata:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        originalFilename:
          type: string
        sanitizedFilename:
          type: string
        category:
          type: string
        attachmentType:
          type: string
        attachmentId:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileSize:
          type: integer
          description: Size in bytes
        mimeType:
          type: string
        uploadedAt:
          type: string
          format: date-time
        uploadedByUserId:
          type: string
        currentVersion:
          type: number
          format: decimal
        versionCount:
          type: integer
        retentionExpiryDate:
          type: string
          format: date
          nullable: true
        legalHold:
          type: boolean
        softDeleted:
          type: boolean
        softDeletedAt:
          type: string
          format: date-time
          nullable: true
        malwareScanResult:
          type: object
          properties:
            scanResultType:
              type: string
            scannedAt:
              type: string
              format: date-time
            threatDetails:
              type: string
              nullable: true

    DocumentSummary:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        originalFilename:
          type: string
        category:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileSize:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        currentVersion:
          type: number

    BulkOperationDetail:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        operationType:
          type: string
          enum: [upload, delete]
        status:
          type: string
          enum: [Queued, In Progress, Completed, Partially Failed, Failed, Cancelled]
        totalCount:
          type: integer
        succeededCount:
          type: integer
        failedCount:
          type: integer
        skippedCount:
          type: integer
        initiatedByUserId:
          type: string
        initiatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              documentId:
                type: string
                format: uuid
              filename:
                type: string
              status:
                type: string
                enum: [Queued, Succeeded, Failed, Skipped]
              errorMessage:
                type: string
                nullable: true
              skipReason:
                type: string
                nullable: true

    OverrideRequestSummary:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Pending, Approved, Rejected, Executed, Expired]
        documentCount:
          type: integer
        justification:
          type: string
        businessReason:
          type: string
        requestedByUserId:
          type: string
        requestedAt:
          type: string
          format: date-time
        approvalsRequired:
          type: integer
        approvalsReceived:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true

    OverrideRequestDetail:
      allOf:
        - $ref: '#/components/schemas/OverrideRequestSummary'
        - type: object
          properties:
            documents:
              type: array
              items:
                $ref: '#/components/schemas/DocumentSummary'
            approvals:
              type: array
              items:
                type: object
                properties:
                  approvedByUserId:
                    type: string
                  approvedAt:
                    type: string
                    format: date-time
                  approvalComments:
                    type: string
                    nullable: true

    DocumentCategorySummary:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        categorySlug:
          type: string
        displayName:
          type: string
        isActive:
          type: boolean
        fileSizeLimitMb:
          type: integer
        retentionPeriodDays:
          type: integer

    DocumentCategoryDetail:
      allOf:
        - $ref: '#/components/schemas/DocumentCategorySummary'
        - type: object
          properties:
            description:
              type: string
            blobContainerName:
              type: string
            allowableFormats:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time
            deprecatedAt:
              type: string
              format: date-time
              nullable: true

    DocumentCategoryCreate:
      type: object
      required: [categorySlug, displayName, allowableFormats, fileSizeLimitMb]
      properties:
        categorySlug:
          type: string
          description: Lowercase, hyphen-separated identifier (e.g., credential-supporting-docs)
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        displayName:
          type: string
        description:
          type: string
        allowableFormats:
          type: array
          minItems: 1
          items:
            type: string
          description: Whitelist of permitted MIME types
        fileSizeLimitMb:
          type: integer
          minimum: 1
          maximum: 500

    AuditLogEntry:
      type: object
      properties:
        accessLogId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        action:
          type: string
          enum: [view, download, upload, replace, delete]
        userId:
          type: string
          format: uuid
        actionTimestamp:
          type: string
          format: date-time
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true

    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

  responses:
    BadRequest:
      description: Invalid request parameters or business rule violation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              validationErrors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string

    Forbidden:
      description: Insufficient permissions for this operation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Conflict:
      description: Conflict — duplicate creation or stale state
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  securitySchemes:
    MiLogin:
      type: oauth2
      description: |
        Used for admin capability endpoints only (legal hold, retention override,
        category management, bulk delete, audit). Infrastructure endpoints
        (upload, download, replacement, staging) are secured via Azure Managed
        Identity at the platform level and do not use MiLogin.
      flows:
        authorizationCode:
          authorizationUrl: https://milogin.michigan.gov/oauth/authorize
          tokenUrl: https://milogin.michigan.gov/oauth/token
          scopes:
            documents:admin: Administrative operations (legal hold, overrides, category management, audit)

# No global security applied — each admin endpoint declares MiLogin explicitly.
# Infrastructure endpoints are secured at the platform/network level via Managed Identity.