openapi: 3.0.3
info:
  title: MiEdWorkforce Professional Learning API
  version: 1.0.0
  description: |
    Manages the SCECH (State Continuing Education Clock Hours) system including
    professional learning program lifecycle, sponsor management, attendance tracking,
    credit awarding, and public catalog search. Primary consumers are coordinators,
    educators, and Professional Learning Admins within the MiEdWorkforce platform.

servers:
  - url: http://proflearning-api.default.svc.cluster.local/api/v1
    description: Internal AKS cluster
  - url: https://api.miedworkforce.mi.gov/proflearning/api/v1
    description: External via APIM

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ----------------------------------------------------------------------------
  # PROGRAM APPLICATIONS
  # ----------------------------------------------------------------------------

  /program-applications:
    get:
      summary: List program applications
      operationId: listProgramApplications
      tags: [ProgramApplications]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.view
      x-scope-sensitive: true
      description: |
        Returns program applications scoped to the caller's organizational context.
        Coordinators see only applications for their sponsor. Admins with system-wide
        authorization see all applications. X-Organization-Context is used by IAM to
        determine which sponsor-scoped authorization applies.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationReviewStatus'
        - name: sponsorId
          in: query
          schema:
            type: string
            format: uuid
        - name: applicationType
          in: query
          schema:
            type: string
            enum: [New, Modify, Renewal]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of program applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgramApplicationSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Submit new or modified program application
      operationId: submitProgramApplication
      tags: [ProgramApplications]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.create
      x-scope-sensitive: true
      description: |
        Coordinator submits a program application (New, Modify, or Renewal).
        Triggers ProgramApplicationSubmitted event; the application appears in the admin's
        pending-review list via GET /program-applications?status=PendingApproval.
        X-Organization-Context must match the sponsor's organization.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramApplicationCreate'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationReviewStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /program-applications/{applicationId}:
    get:
      summary: Get program application
      operationId: getProgramApplication
      tags: [ProgramApplications]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.view
      x-scope-sensitive: false
      description: |
        Returns full application details. Scope is resolved server-side from the
        application's owning sponsor — X-Organization-Context is not required.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramApplicationDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /program-applications/{applicationId}/approve:
    post:
      summary: Approve program application
      operationId: approveProgramApplication
      tags: [ProgramApplications]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.approve
      x-scope-sensitive: false
      description: |
        Transitions application from PendingApproval to Approved. Creates the
        approved Program record. Scope resolved server-side from the application.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewerNotes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Application approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  programId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationReviewStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /program-applications/{applicationId}/reject:
    post:
      summary: Reject program application
      operationId: rejectProgramApplication
      tags: [ProgramApplications]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.approve
      x-scope-sensitive: false
      description: |
        Transitions application from PendingApproval to Rejected.
        Scope resolved server-side from the application.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
              properties:
                rejectionReason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Application rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationReviewStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /program-applications/{applicationId}/request-info:
    post:
      summary: Request additional information from sponsor
      operationId: requestProgramApplicationInfo
      tags: [ProgramApplications]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.approve
      x-scope-sensitive: false
      description: |
        Transitions application from PendingApproval to RequiresInfo.
        Notifies coordinator via Notification platform capability.
        Scope resolved server-side from the application.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [infoRequest]
              properties:
                infoRequest:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Information request sent to sponsor
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ApplicationReviewStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # PROGRAMS
  # ----------------------------------------------------------------------------

  /programs:
    get:
      summary: List programs
      operationId: listPrograms
      tags: [Programs]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.view
      x-scope-sensitive: true
      description: |
        Returns approved programs scoped to the caller's organizational context.
        Coordinators see programs under their sponsor. Admins with system-wide
        authorization see all programs across sponsors.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: sponsorId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProgramStatus'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of programs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgramSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /programs/{programId}:
    get:
      summary: Get program
      operationId: getProgram
      tags: [Programs]
      # NOTE: Non-standard — this endpoint supports two access patterns (mirrors the
      # dual-access convention used by credentialing-api.yml's
      # GET /educators/{educatorId}/credentials).
      # internal-user: MiLogin token; authenticated staff/sponsor view, any status.
      # external-public: unauthenticated via APIM; Active programs only, referenced
      #   from /catalog/search results.
      x-access: internal-user, external-public
      x-permissions-required:
        - proflearning.program.view
      x-scope-sensitive: false
      description: |
        Returns full program details. Scope resolved server-side from the program's
        owning sponsor — X-Organization-Context is not required.

        Supports two access patterns (non-standard — see x-access note above):
        - **internal-user**: authenticated staff/sponsor view; any program status.
        - **external-public**: unauthenticated via APIM for Active programs only
          (see /catalog/search) — permission check is bypassed for this access
          pattern, and non-Active programs return 404 rather than program detail.
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{programId}/withdraw:
    post:
      summary: Withdraw program
      operationId: withdrawProgram
      tags: [Programs]
      x-access: internal-user
      x-permissions-required:
        - proflearning.program.withdraw
      x-scope-sensitive: false
      description: |
        Transitions program from Active or Approved to Withdrawn.
        Scope resolved server-side from the program's owning sponsor.
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Program withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  programId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ProgramStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # SESSIONS & ATTENDANCE
  # ----------------------------------------------------------------------------

  /sessions/{sessionId}/attendees:
    get:
      summary: View session roster
      operationId: getSessionRoster
      tags: [Attendance]
      x-access: internal-user
      x-permissions-required:
        - proflearning.attendance.view
      x-scope-sensitive: false
      description: |
        Returns the current enrollment roster for the session.
        Scope resolved server-side from the session's owning program.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRoster'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Add attendee to session roster
      operationId: addAttendee
      tags: [Attendance]
      x-access: internal-user
      x-permissions-required:
        - proflearning.attendance.add
      x-scope-sensitive: false
      description: |
        Adds an educator to the session roster. Validates the educatorUniqueId
        against the Mi-Key registry. Scope resolved server-side from the session.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [educatorUniqueId]
              properties:
                educatorUniqueId:
                  type: string
                  description: Validated Mi-Key Unique ID
      responses:
        '201':
          description: Attendee added
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendeeId:
                    type: string
                    format: uuid
                  defaultScechAward:
                    $ref: '#/components/schemas/ScechAllocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Educator already enrolled in this session

  /sessions/{sessionId}/attendees/bulk-upload:
    post:
      summary: Bulk add attendees from CSV
      operationId: bulkUploadAttendees
      tags: [Attendance]
      x-access: internal-user
      x-permissions-required:
        - proflearning.attendance.add
      x-scope-sensitive: false
      description: |
        Asynchronously adds multiple attendees from a CSV file containing Unique IDs.
        Scope resolved server-side from the session.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [attendeesFile]
              properties:
                attendeesFile:
                  type: string
                  format: binary
                  description: CSV with Unique IDs
      responses:
        '202':
          description: Bulk upload accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  statusUrl:
                    type: string
                    format: uri
                  processed:
                    type: integer
                  added:
                    type: integer
                  failed:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                        uniqueId:
                          type: string
                        reason:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/{sessionId}/certify:
    post:
      summary: Certify attendance and award SCECHs
      operationId: certifyAttendance
      tags: [Attendance]
      x-access: internal-user
      x-permissions-required:
        - proflearning.attendance.certify
      x-scope-sensitive: false
      description: |
        Coordinator certifies attendance. SCECH awards become immutable after certification.
        Blocked if required evaluations are not submitted.
        Publishes AttendanceCertified event consumed by Credentialing domain.
        Scope resolved server-side from the session's owning program.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation:
                  type: boolean
                  description: Coordinator attests to accuracy of attendance records
                  enum: [true]
      responses:
        '200':
          description: Attendance certified
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  certifiedAt:
                    type: string
                    format: date-time
                  attendeeCount:
                    type: integer
                  totalScechsAwarded:
                    type: integer
        '400':
          description: Cannot certify — pending evaluations or other blocking conditions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session already certified

  /session-attendees/{attendeeId}/scech-award:
    patch:
      summary: Adjust SCECH award for attendee
      operationId: adjustScechAward
      tags: [Attendance]
      x-access: internal-user
      x-permissions-required:
        - proflearning.attendance.adjust
      x-scope-sensitive: false
      description: |
        Adjusts the SCECH award for an individual attendee before certification.
        Post-certification changes require a correction request.
        Scope resolved server-side from the attendee's session.
      parameters:
        - name: attendeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [awardedScechs]
              properties:
                awardedScechs:
                  $ref: '#/components/schemas/ScechAllocation'
                adjustmentReason:
                  type: string
                  maxLength: 1000
                  description: Optional justification for partial attendance adjustment
      responses:
        '200':
          description: SCECH award updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendeeId:
                    type: string
                    format: uuid
                  awardedScechs:
                    $ref: '#/components/schemas/ScechAllocation'
        '400':
          description: Award exceeds program maximum or session already certified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # SCECH CORRECTION REQUESTS
  # ----------------------------------------------------------------------------

  /correction-requests:
    get:
      summary: List correction requests
      operationId: listCorrectionRequests
      tags: [CorrectionRequests]
      x-access: internal-user
      x-permissions-required:
        - proflearning.correction.view
      x-scope-sensitive: true
      description: |
        Returns correction requests scoped to the caller's organizational context.
        Coordinators see only requests for sessions under their sponsor.
        Admins with system-wide authorization see all correction requests.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CorrectionRequestStatus'
        - name: sessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: sponsorId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of correction requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CorrectionRequestSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

    post:
      summary: Submit SCECH correction request
      operationId: submitCorrectionRequest
      tags: [CorrectionRequests]
      x-access: internal-user
      x-permissions-required:
        - proflearning.correction.submit
      x-scope-sensitive: false
      description: |
        Required for any changes to SCECH awards after attendance has been certified.
        Appears in the admin's correction-request review list via
        GET /correction-requests?status=Submitted.
        Scope resolved server-side from the session's owning program.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, attendeeId, requestedScechs, justification]
              properties:
                sessionId:
                  type: string
                  format: uuid
                attendeeId:
                  type: string
                  format: uuid
                requestedScechs:
                  $ref: '#/components/schemas/ScechAllocation'
                  description: New requested SCECH allocation (must not exceed program max)
                justification:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Correction request submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  correctionRequestId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/CorrectionRequestStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate pending correction request for this attendee

  /correction-requests/{correctionRequestId}/approve:
    post:
      summary: Approve correction request
      operationId: approveCorrectionRequest
      tags: [CorrectionRequests]
      x-access: internal-user
      x-permissions-required:
        - proflearning.correction.approve
      x-scope-sensitive: false
      description: |
        Transitions correction request from UnderReview to Approved.
        Updates attendance roster and publishes SCECHCorrectionApproved event
        consumed by Credentialing domain.
        Scope resolved server-side from the correction request.
      parameters:
        - $ref: '#/components/parameters/CorrectionRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNotes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Correction approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  correctionRequestId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/CorrectionRequestStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request already resolved

  /correction-requests/{correctionRequestId}/deny:
    post:
      summary: Deny correction request
      operationId: denyCorrectionRequest
      tags: [CorrectionRequests]
      x-access: internal-user
      x-permissions-required:
        - proflearning.correction.approve
      x-scope-sensitive: false
      description: |
        Transitions correction request from UnderReview to Denied.
        Admin notes are required to explain the denial reason.
        Scope resolved server-side from the correction request.
      parameters:
        - $ref: '#/components/parameters/CorrectionRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminNotes]
              properties:
                adminNotes:
                  type: string
                  maxLength: 2000
                  description: Required — must explain denial reason
      responses:
        '200':
          description: Correction denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  correctionRequestId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/CorrectionRequestStatus'
        '400':
          description: Admin notes required for denial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # COLLEGE COURSE CREDIT (Educator self-service)
  # ----------------------------------------------------------------------------

  /my/college-courses/eligible:
    get:
      summary: Get eligible college courses for current educator
      operationId: getEligibleCollegeCourses
      tags: [CollegeCourses]
      x-access: internal-user
      x-permissions-required:
        - proflearning.collegecourse.apply
      x-scope-sensitive: false
      description: |
        Returns STARR courses completed after the educator's last credential issuance
        date, excluding courses already applied for SCECH credit. Scope is always
        self-only — the result set is constrained to the authenticated user.
      responses:
        '200':
          description: Eligible college courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EligibleCourse'
                  lastCredentialIssuanceDate:
                    type: string
                    format: date
                    description: Date used to determine course eligibility

  /my/college-courses:
    post:
      summary: Apply college course for SCECH credit
      operationId: applyCollegeCourse
      tags: [CollegeCourses]
      x-access: internal-user
      x-permissions-required:
        - proflearning.collegecourse.apply
      x-scope-sensitive: false
      description: |
        Educator selects an eligible STARR course to apply toward SCECH requirements.
        Conversion rate: 1 semester credit = 15 SCECH hours.
        Publishes CollegeCourseApplied event consumed by Credentialing domain.
        Always operates on the authenticated user's own records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starrCourseRecordId]
              properties:
                starrCourseRecordId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: College course applied for SCECH credit
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    format: uuid
                  courseName:
                    type: string
                  semesterCredits:
                    type: number
                    format: decimal
                  scechsAwarded:
                    type: integer
                    description: semesterCredits * 15 (configurable conversion rate)
        '400':
          description: Course not eligible or already applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Course record not found

  # ----------------------------------------------------------------------------
