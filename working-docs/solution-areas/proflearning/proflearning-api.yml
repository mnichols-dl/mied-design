  /evaluation-templates/{templateId}:
    put:
      summary: Update evaluation template
      operationId: updateEvaluationTemplate
      tags: [EvaluationTemplates]
      x-access: internal-user
      x-permissions-required:
        - proflearning.admin.evaluationtemplates
      x-scope-sensitive: false
      description: |
        Full replacement update of an evaluation template. System-wide admin operation.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationTemplateCreate'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  templateId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
