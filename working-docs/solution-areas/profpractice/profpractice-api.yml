openapi: 3.0.3
info:
  title: MiEdWorkforce Professional Practice Review API
  version: 1.0.0
  description: |
    Manages educator disclosure lifecycle, PPR compliance responses, external background
    check integrations (Rap Back/CHRISS, NASDTEC), clearance assessments, and PPR worklist
    management. Provides PPR-specific clearance and roster eligibility assessments to
    Credentialing and Staffing domains.

servers:
  - url: http://ppr-api.default.svc.cluster.local/api/v1
    description: Internal AKS cluster
  - url: https://api.miedworkforce.mi.gov/profpractice/api/v1
    description: External via APIM

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ----------------------------------------------------------------------------
  # DISCLOSURES
  # ----------------------------------------------------------------------------

  /disclosures:
    post:
      summary: Submit self-disclosure
      operationId: submitDisclosure
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.disclosure.submit
      x-scope-sensitive: false
      description: |
        Educator voluntarily reports a new criminal conviction or professional
        disciplinary action. At least one supporting document must be attached.
        System routes disclosure to OEE worklist upon submission.
        Scope is self-only — the disclosure is always created for the authenticated educator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisclosureCreate'
      responses:
        '201':
          description: Disclosure created and routed to review queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  disclosureId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/DisclosureStatus'
                  submittedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: List disclosures
      operationId: listDisclosures
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.disclosure.view
      x-scope-sensitive: true
      description: |
        Returns disclosures scoped to the caller's authorization context specified
        by X-Organization-Context. Authenticated educators see only their own
        disclosures. PPR Reviewers with system-wide or worklist-specific scope see
        disclosures within their authorized scope. Admin users may filter by educatorId.
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: educatorId
          in: query
          description: Admin only — filter by specific educator
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DisclosureStatus'
        - name: disclosureType
          in: query
          schema:
            $ref: '#/components/schemas/DisclosureType'
        - name: sourceType
          in: query
          schema:
            $ref: '#/components/schemas/DisclosureSourceType'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated disclosure list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisclosureSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'

  /disclosures/{disclosureId}:
    get:
      summary: Get disclosure
      operationId: getDisclosure
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.disclosure.view
      x-scope-sensitive: false
      description: |
        Returns full disclosure detail. Scope is resolved server-side from the
        disclosure's owning educator — X-Organization-Context is not required.
      parameters:
        - $ref: '#/components/parameters/DisclosureId'
      responses:
        '200':
          description: Disclosure detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update disclosure details
      operationId: updateDisclosure
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.disclosure.edit
      x-scope-sensitive: false
      description: |
        Only allowed while disclosure status is "UnderPprReview".
        Once transitioned to any "Reviewed" status, disclosure is locked.
        PPR Reviewer permission required. Scope is resolved server-side from
        the disclosure's owning educator.
      parameters:
        - $ref: '#/components/parameters/DisclosureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disclosureType:
                  $ref: '#/components/schemas/DisclosureType'
                convictionDate:
                  type: string
                  format: date
                  description: Must not be future-dated
                description:
                  type: string
                  maxLength: 5000
                documentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: |
                    References to documents managed by Documents capability.
                    Replaces current document list.
      responses:
        '200':
          description: Disclosure updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /disclosures/{disclosureId}/update-status:
    post:
      summary: Update disclosure status
      operationId: updateDisclosureStatus
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.status.update
      x-scope-sensitive: false
      description: |
        Transitions disclosure from one review state to another. Valid status
        transitions are enforced by domain logic. Transitions to any "Reviewed"
        status also require reviewNotes and invoke profpractice.disclosure.finalize
        authorization. Scope is resolved server-side from the disclosure's owning educator.
      parameters:
        - $ref: '#/components/parameters/DisclosureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStatus]
              properties:
                newStatus:
                  $ref: '#/components/schemas/DisclosureStatus'
                reviewNotes:
                  type: string
                  maxLength: 5000
                  description: Required when transitioning to any "Reviewed" status
      responses:
        '200':
          description: Disclosure status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  disclosureId:
                    type: string
                    format: uuid
                  previousStatus:
                    $ref: '#/components/schemas/DisclosureStatus'
                  newStatus:
                    $ref: '#/components/schemas/DisclosureStatus'
                  updatedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /disclosures/{disclosureId}/add-remark:
    post:
      summary: Add remark to disclosure
      operationId: addDisclosureRemark
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.remarks.add
      x-scope-sensitive: false
      description: |
        Adds an internal or external remark to a disclosure. Internal remarks are
        visible to PPR staff only. External remarks may be visible to the educator.
        Scope is resolved server-side from the disclosure's owning educator.
      parameters:
        - $ref: '#/components/parameters/DisclosureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarkText, remarkType]
              properties:
                remarkText:
                  type: string
                  maxLength: 5000
                remarkType:
                  type: string
                  enum: [Internal, External]
                  description: |
                    Internal = staff-only visibility.
                    External = may be shared with educator.
      responses:
        '201':
          description: Remark added
          content:
            application/json:
              schema:
                type: object
                properties:
                  remarkId:
                    type: string
                    format: uuid
                  addedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /disclosures/{disclosureId}/log-action:
    post:
      summary: Log non-system action on disclosure
      operationId: logNonSystemAction
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.actions.log
      x-scope-sensitive: false
      description: |
        Documents external activities taken by PPR staff outside the system
        (phone calls, emails, manual document reviews, referrals).
        Does not change disclosure status. Scope is resolved server-side
        from the disclosure's owning educator.
      parameters:
        - $ref: '#/components/parameters/DisclosureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionType, description]
              properties:
                actionType:
                  type: string
                  enum:
                    - NotifiedSchoolDistrict
                    - ReferredToPPR
                    - NotifiedMSPRemoval
                    - ContactedEducator
                    - ReviewedExternalDocuments
                    - Other
                description:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Non-system action logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  actionId:
                    type: string
                    format: uuid
                  loggedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /disclosures/from-nasdtec:
    post:
      summary: Create disclosure from NASDTEC record
      operationId: createDisclosureFromNasdtec
      tags: [Disclosures]
      x-access: internal-user
      x-permissions-required:
        - profpractice.nasdtec.view
        - profpractice.disclosure.submit
      x-scope-sensitive: false
      description: |
        PPR reviewer creates a formal disclosure record after reviewing out-of-state
        disciplinary data from NASDTEC. Links the new disclosure to the originating
        ExternalBackgroundCheck record. Scope is resolved server-side from the
        ExternalBackgroundCheck record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalCheckId, educatorId, disclosureType, description]
              properties:
                externalCheckId:
                  type: string
                  format: uuid
                  description: Reference to NASDTEC ExternalBackgroundCheck record
                educatorId:
                  type: string
                  description: Educator's Unique ID (Mi-Key)
                disclosureType:
                  $ref: '#/components/schemas/DisclosureType'
                convictionDate:
                  type: string
                  format: date
                description:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Disclosure created from NASDTEC record
          content:
            application/json:
              schema:
                type: object
                properties:
                  disclosureId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/DisclosureStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # DISCLOSURE QUESTION CONFIGURATION
  # ----------------------------------------------------------------------------

  /disclosure-questions:
    get:
      summary: Get disclosure question configuration
      operationId: getDisclosureQuestions
      tags: [Configuration]
      x-access: internal-user
      x-permissions-required:
        - profpractice.questions.view
      x-scope-sensitive: false
      description: |
        Returns active question set with branching logic for self-disclosure forms.
        Used by UI to dynamically render the disclosure entry form.
      responses:
        '200':
          description: Disclosure question configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionConfiguration'

  # ----------------------------------------------------------------------------
  # PPR RESPONSES
  # ----------------------------------------------------------------------------

  /ppr-responses:
    post:
      summary: Submit Professional Practice Review response
      operationId: submitPprResponse
      tags: [PPR Responses]
      x-access: internal-user
      x-permissions-required:
        - profpractice.response.submit
      x-scope-sensitive: false
      description: |
        Educator submits annual compliance check. If any "Yes" answers are provided,
        Disclosure aggregates are automatically created and routed to OEE worklist.
        Updates LastPPRResponseDate regardless of answers. Scope is self-only —
        the response is always recorded for the authenticated educator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PprResponseCreate'
      responses:
        '201':
          description: PPR response submitted and compliance date updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseId:
                    type: string
                    format: uuid
                  responseDate:
                    type: string
                    format: date-time
                  newDisclosuresReported:
                    type: boolean
                  createdDisclosureIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: IDs of disclosures created from "Yes" answers
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ppr-questions:
    get:
      summary: Get PPR question configuration
      operationId: getPprQuestions
      tags: [Configuration]
      x-access: internal-user
      x-permissions-required:
        - profpractice.questions.view
      x-scope-sensitive: false
      description: |
        Returns active question set for the annual Professional Practice Review form.
        Includes branching logic for follow-up questions on "Yes" answers.
      responses:
        '200':
          description: PPR question configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionConfiguration'

  # ----------------------------------------------------------------------------
  # EDUCATOR PPR STATUS & ASSESSMENTS
  # ----------------------------------------------------------------------------

  /educators/{educatorId}/ppr-status:
    get:
      summary: Get educator PPR status
      operationId: getEducatorPprStatus
      tags: [Educator Status]
      x-access: internal-user
      x-permissions-required:
        - profpractice.disclosure.view
        - profpractice.markers.view
      x-scope-sensitive: false
      description: |
        Returns current account markers, disclosure summary, compliance status,
        and annual PPR response date. Used by UI to display the educator's PPR
        overview. Scope is resolved server-side from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      responses:
        '200':
          description: Educator PPR status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducatorPprStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /educators/{educatorId}/ppr-clearance:
    get:
      summary: Get PPR clearance assessment (internal service)
      operationId: getPprClearanceAssessment
      tags: [Educator Status]
      x-access: internal-service
      x-permissions-required:
        - profpractice.clearance.view
      x-scope-sensitive: false
      description: |
        Called by the Credentialing domain to evaluate PPR clearance before processing
        a credential application. Assessment is computed on-demand and never cached.
        Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.

        Priority order:
        1. Mandatory Hold Requirement active → Hold
        2. "ReviewedListed" disclosure exists → Blocked
        3. "ReviewedFelony" disclosure exists → ConditionalClearance + felony ack required
        4. Active review disclosure exists → Hold
        5. Enhanced Monitoring Status active → ConditionalClearance
        6. No concerns → Clear
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      responses:
        '200':
          description: PPR clearance assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PprClearanceAssessment'
        '404':
          $ref: '#/components/responses/NotFound'

  /educators/{educatorId}/roster-eligibility:
    get:
      summary: Get roster eligibility assessment (internal service)
      operationId: getRosterEligibilityAssessment
      tags: [Educator Status]
      x-access: internal-service
      x-permissions-required:
        - profpractice.eligibility.view
      x-scope-sensitive: false
      description: |
        Called by the Staffing domain to evaluate PPR-based roster eligibility before
        adding an educator to a district roster. Assessment is computed on-demand and
        never cached. Not exposed via APIM. Authenticated via Managed Identity / mTLS.
        No user token is present; X-Organization-Context does not apply.

        Priority order:
        1. "ReviewedListed" disclosure exists → Ineligible
        2. Active review disclosure exists → Ineligible
        3. "ReviewedFelony" disclosure exists → EligibleWithNotification
        4. No concerns → Eligible
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      responses:
        '200':
          description: Roster eligibility assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterEligibilityAssessment'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # ACCOUNT MARKERS
  # ----------------------------------------------------------------------------

  /educators/{educatorId}/markers/mandatory-hold:
    post:
      summary: Set Mandatory Hold Requirement
      operationId: setMandatoryHold
      tags: [Account Markers]
      x-access: internal-user
      x-permissions-required:
        - profpractice.markers.manage
      x-scope-sensitive: false
      description: |
        Activates Mandatory Hold Requirement, causing all future credential
        applications to be placed in "PPR Hold" status upon submission.
        Justification required. Fully audited. Scope is resolved server-side
        from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerSetRequest'
      responses:
        '200':
          description: Mandatory Hold Requirement activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Clear Mandatory Hold Requirement
      operationId: clearMandatoryHold
      tags: [Account Markers]
      x-access: internal-user
      x-permissions-required:
        - profpractice.markers.manage
      x-scope-sensitive: false
      description: |
        Deactivates Mandatory Hold Requirement. Justification required. Fully audited.
        Scope is resolved server-side from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerClearRequest'
      responses:
        '200':
          description: Mandatory Hold Requirement cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /educators/{educatorId}/markers/enhanced-monitoring:
    post:
      summary: Set Enhanced Monitoring Status
      operationId: setEnhancedMonitoring
      tags: [Account Markers]
      x-access: internal-user
      x-permissions-required:
        - profpractice.markers.manage
      x-scope-sensitive: false
      description: |
        Activates Enhanced Monitoring Status. PPR staff receive alerts when new
        applications are submitted, but normal processing continues. Justification
        required. Fully audited. Scope is resolved server-side from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerSetRequest'
      responses:
        '200':
          description: Enhanced Monitoring Status activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Clear Enhanced Monitoring Status
      operationId: clearEnhancedMonitoring
      tags: [Account Markers]
      x-access: internal-user
      x-permissions-required:
        - profpractice.markers.manage
      x-scope-sensitive: false
      description: |
        Deactivates Enhanced Monitoring Status. Justification required. Fully audited.
        Scope is resolved server-side from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerClearRequest'
      responses:
        '200':
          description: Enhanced Monitoring Status cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /educators/{educatorId}/markers/rereview:
    post:
      summary: Set Re-Review Requirement
      operationId: setReReview
      tags: [Account Markers]
      x-access: internal-user
      x-permissions-required:
        - profpractice.markers.manage
      x-scope-sensitive: false
      description: |
        Activates Re-Review Requirement, forcing previously-reviewed disclosures
        back into the PPR worklist for additional scrutiny. Justification required.
        Fully audited. Scope is resolved server-side from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerSetRequest'
      responses:
        '200':
          description: Re-Review Requirement activated and disclosures re-routed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MarkerChangeResult'
                  - type: object
                    properties:
                      reroutedDisclosureCount:
                        type: integer
                        description: Number of disclosures re-routed to worklist
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Clear Re-Review Requirement
      operationId: clearReReview
      tags: [Account Markers]
      x-access: internal-user
      x-permissions-required:
        - profpractice.markers.manage
      x-scope-sensitive: false
      description: |
        Deactivates Re-Review Requirement. Justification required. Fully audited.
        Scope is resolved server-side from the educator record.
      parameters:
        - $ref: '#/components/parameters/EducatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkerClearRequest'
      responses:
        '200':
          description: Re-Review Requirement cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # WORKLISTS
  # ----------------------------------------------------------------------------

  /worklists:
    get:
      summary: List PPR worklists
      operationId: listWorklists
      tags: [Worklists]
      x-access: internal-user
      x-permissions-required:
        - profpractice.worklist.view
      x-scope-sensitive: false
      description: |
        Returns worklists accessible to the authenticated reviewer. PPR Reviewers
        see only worklists to which they are assigned. PPR Admins see all worklists.
        Scope is resolved server-side from the caller's worklist assignments.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Paused]
      responses:
        '200':
          description: Worklist list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorklistSummary'

    post:
      summary: Create PPR worklist
      operationId: createWorklist
      tags: [Worklists]
      x-access: internal-user
      x-permissions-required:
        - profpractice.worklist.configure
      x-scope-sensitive: false
      description: |
        Creates a new PPR worklist with routing and priority rules. PPR Admin only.
        Returns a 400 if routing rules conflict with an existing active worklist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorklistCreate'
      responses:
        '201':
          description: Worklist created
          content:
            application/json:
              schema:
                type: object
                properties:
                  worklistId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /worklists/{worklistId}:
    put:
      summary: Update PPR worklist
      operationId: updateWorklist
      tags: [Worklists]
      x-access: internal-user
      x-permissions-required:
        - profpractice.worklist.configure
      x-scope-sensitive: false
      description: |
        Updates routing rules, priority rules, or reviewer assignments for an
        existing worklist. PPR Admin only.
      parameters:
        - name: worklistId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorklistCreate'
      responses:
        '200':
          description: Worklist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /worklists/{worklistId}/disclosures:
    get:
      summary: Get disclosures in worklist
      operationId: getWorklistDisclosures
      tags: [Worklists]
      x-access: internal-user
      x-permissions-required:
        - profpractice.worklist.view
        - profpractice.disclosure.view
      x-scope-sensitive: false
      description: |
        Returns paginated disclosures queued in the specified worklist.
        PPR Reviewers must be assigned to the worklist to access it.
        Scope is resolved server-side from the caller's worklist assignments.
      parameters:
        - name: worklistId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: disclosureType
          in: query
          schema:
            $ref: '#/components/schemas/DisclosureType'
        - name: dateReportedFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateReportedTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated disclosures in worklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisclosureSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # EXTERNAL BACKGROUND CHECKS
  # ----------------------------------------------------------------------------

  /external-checks/{checkId}:
    get:
      summary: Get external background check
      operationId: getExternalCheck
      tags: [External Checks]
      x-access: internal-user
      x-permissions-required:
        - profpractice.rapback.view
      x-scope-sensitive: false
      description: |
        Returns metadata for a Rap Back or NASDTEC check. Does NOT return full
        rap sheet content — use /rapback/retrieve-rapsheet for transient display.
        Scope is resolved server-side from the check record.
      parameters:
        - name: checkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: External background check details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalBackgroundCheck'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /external-checks/{checkId}/add-remark:
    post:
      summary: Add remark to external check
      operationId: addExternalCheckRemark
      tags: [External Checks]
      x-access: internal-user
      x-permissions-required:
        - profpractice.remarks.add
      x-scope-sensitive: false
      description: |
        Adds an internal remark to an external background check record.
        Scope is resolved server-side from the check record.
      parameters:
        - name: checkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarkText]
              properties:
                remarkText:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Remark added
          content:
            application/json:
              schema:
                type: object
                properties:
                  remarkId:
                    type: string
                    format: uuid
                  addedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------------
  # RAP BACK OPERATIONS
  # ----------------------------------------------------------------------------

  /rapback/retrieve-rapsheet:
    post:
      summary: Retrieve full rap sheet from CHRISS
      operationId: retrieveRapSheet
      tags: [External Checks]
      x-access: internal-user
      x-permissions-required:
        - profpractice.rapsheet.retrieve
      x-scope-sensitive: false
      description: |
        Initiates an on-demand SOAP call to CHRISS GET_RAPBACK to retrieve the full
        criminal history report for transient display. CRITICAL: Rap sheet content is
        NEVER stored. Only retrieval metadata (who, when) is logged in the
        ExternalBackgroundCheck audit trail. Scope is resolved server-side from the
        ExternalBackgroundCheck record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkId]
              properties:
                checkId:
                  type: string
                  format: uuid
                  description: Reference to RapBack ExternalBackgroundCheck record (provides TCN)
      responses:
        '200':
          description: |
            Rap sheet content returned transiently for display.
            Content must not be persisted by the consuming UI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rapSheetText:
                    type: string
                    description: Full rap sheet content for transient display only
                  retrievedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: CHRISS SOAP API unavailable

  # ----------------------------------------------------------------------------
  # REPORTS
  # ----------------------------------------------------------------------------

  /reports/data:
    get:
      summary: Get PPR report data
      operationId: getPprReportData
      tags: [Reports]
      x-access: internal-user
      x-permissions-required:
        - profpractice.report.view
      x-scope-sensitive: true
      description: |
        Returns aggregated data for PPR compliance and metrics reports. Results are
        constrained to the organization specified by X-Organization-Context. Users with
        ISD-level authorization will see results for all constituent districts. System-wide
        admins see all data. Rendered by external reporting platform (Power BI).
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: reportType
          in: query
          required: true
          schema:
            type: string
            enum:
              - DisclosureProcessingMetrics
              - AnnualPprComplianceStatus
              - ReviewTimelineAnalysis
              - AccountMarkerSummary
              - ExternalIntegrationStatus
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: disclosureType
          in: query
          schema:
            $ref: '#/components/schemas/DisclosureType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DisclosureStatus'
        - name: worklistId
          in: query
          schema:
            type: string
            format: uuid
        - name: entityCode
          in: query
          description: Filter by organization code (scope-aware)
          schema:
            type: string
      responses:
        '200':
          description: Report data
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportType:
                    type: string
                  generatedAt:
                    type: string
                    format: date-time
                  data:
                    type: object
                    description: Report-specific structured data
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------------------
  # ADMIN JOB TRIGGERS
  # ----------------------------------------------------------------------------

  /admin/jobs/process-nasdtec-batch:
    post:
      summary: Trigger NASDTEC nightly batch processing
      operationId: processNasdtecBatch
      tags: [Admin Jobs]
      x-access: internal-service
      x-permissions-required:
        - profpractice.nasdtec.view
      x-scope-sensitive: false
      description: |
        Called by Azure Synapse Pipeline nightly to pull and process NASDTEC
        interstate disciplinary records. Matches records to Michigan educators via
        Mi-Key and routes matched records to PPR worklist. Not exposed via APIM.
        Authenticated via Managed Identity / mTLS. No user token is present.
      responses:
        '202':
          description: Batch processing initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  initiatedAt:
                    type: string
                    format: date-time
                  statusUrl:
                    type: string
                    format: uri
                    description: Polling URL to check batch job status

  # ----------------------------------------------------------------------------
  # EXTERNAL WEBHOOKS
  # ----------------------------------------------------------------------------

  /webhooks/rapback:
    post:
      summary: Receive Rap Back notification
      operationId: receiveRapBackNotification
      tags: [Webhooks]
      x-access: external-client
      x-permissions-required: []
      x-scope-sensitive: false
      description: |
        Receives push notifications from Michigan State Police Rap Back system when new
        criminal activity is detected for enrolled educators. Creates an
        ExternalBackgroundCheck record, a placeholder Disclosure, and routes to OEE
        worklist. Always returns 200 OK regardless of person match outcome.
        External system (MSP Rap Back) via APIM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tcn, notificationDate, judicialMarker]
              properties:
                tcn:
                  type: string
                  description: Transaction Control Number
                notificationDate:
                  type: string
                  format: date
                judicialMarker:
                  type: string
                  description: Criminal event indicator from MSP
                pic:
                  type: string
                  description: |
                    Person Identifier — if empty, Mi-Key matching required
                    using SSN/DOB/Name
      responses:
        '200':
          description: Notification acknowledged

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:

  parameters:
    DisclosureId:
      name: disclosureId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EducatorId:
      name: educatorId
      in: path
      required: true
      schema:
        type: string
      description: Educator's Unique ID (Mi-Key)

    OrganizationContext:
      name: X-Organization-Context
      in: header
      required: true
      description: |
        The organization code representing the caller's active authorization context.
        Used by IAM to determine which organizational scope applies when evaluating
        permissions. Must match an organization for which the caller holds the required
        permission (directly or transitively via the org hierarchy).
        Required on all scope-sensitive operations (x-scope-sensitive: true).
      schema:
        type: string
        example: district-10

  schemas:

    # ---- Enums ---------------------------------------------------------------

    DisclosureStatus:
      type: string
      enum:
        - PendingReview
        - UnderPprReview
        - PprHold
        - PprDocumentHold
        - ReviewedNoActionRequired
        - ReviewedNonEnumerated
        - ReviewedMisdemeanor
        - ReviewedFelony
        - ReviewedListed
        - ReviewedArraignment

    DisclosureType:
      type: string
      enum:
        - Misdemeanor
        - Felony
        - CredentialSuspension
        - CredentialRevocation
        - CredentialSurrender
        - CredentialNullification
        - PendingCredentialAction

    DisclosureSourceType:
      type: string
      enum:
        - SelfDisclosed
        - RapBackTriggered
        - NASDTECTriggered
        - PPRResponse
        - AdminEntered

    PprClearanceStatus:
      type: string
      enum:
        - Clear
        - ConditionalClearance
        - Hold
        - Blocked

    RosterEligibilityStatus:
      type: string
      enum:
        - Eligible
        - EligibleWithNotification
        - Ineligible

    # ---- Request Schemas -----------------------------------------------------

    DisclosureCreate:
      type: object
      required: [disclosureType, convictionDate, description, documentIds]
      properties:
        disclosureType:
          $ref: '#/components/schemas/DisclosureType'
        convictionDate:
          type: string
          format: date
          description: Must not be future-dated
        description:
          type: string
          maxLength: 5000
        documentIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: |
            At least one supporting document required (court orders, police reports, etc.).
            Documents managed by Documents capability; PPR stores document ID references only.

    PprResponseCreate:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionKey, answer]
            properties:
              questionKey:
                type: string
                description: Question identifier from /ppr-questions configuration
              answer:
                type: string
                enum: [Yes, No]
              followUpAnswers:
                type: object
                additionalProperties: true
                description: Branching follow-up responses when answer = Yes
        newDisclosures:
          type: array
          description: Required when any answer = Yes; details for each new incident
          items:
            $ref: '#/components/schemas/DisclosureCreate'

    MarkerSetRequest:
      type: object
      required: [justification]
      properties:
        justification:
          type: string
          maxLength: 2000
          description: Required reason for activating marker. Fully audited.

    MarkerClearRequest:
      type: object
      required: [justification]
      properties:
        justification:
          type: string
          maxLength: 2000
          description: Required reason for clearing marker. Fully audited.

    WorklistCreate:
      type: object
      required: [worklistName, routingRules]
      properties:
        worklistName:
          type: string
        routingRules:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field:
                type: string
                enum: [disclosureType, disclosureStatus, sourceType, convictionDateFrom, convictionDateTo]
              operator:
                type: string
                enum: [equals, in, before, after]
              value:
                type: string
        priorityRules:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum: [dateReported, convictionDate, disclosureType]
              direction:
                type: string
                enum: [asc, desc]
        assignedReviewerIds:
          type: array
          items:
            type: string
            format: uuid

    # ---- Response Schemas ----------------------------------------------------

    DisclosureSummary:
      type: object
      properties:
        disclosureId:
          type: string
          format: uuid
        educatorUniqueId:
          type: string
        disclosureType:
          $ref: '#/components/schemas/DisclosureType'
        status:
          $ref: '#/components/schemas/DisclosureStatus'
        sourceType:
          $ref: '#/components/schemas/DisclosureSourceType'
        convictionDate:
          type: string
          format: date
        dateReported:
          type: string
          format: date-time
        worklistId:
          type: string
          format: uuid
          nullable: true
          description: Worklist this disclosure is currently assigned to
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DisclosureDetail:
      allOf:
        - $ref: '#/components/schemas/DisclosureSummary'
        - type: object
          properties:
            description:
              type: string
            documentIds:
              type: array
              items:
                type: string
                format: uuid
              description: Document IDs managed by Documents capability
            internalRemarks:
              type: array
              description: Visible to PPR staff only
              items:
                $ref: '#/components/schemas/Remark'
            externalRemarks:
              type: array
              description: May be visible to educator
              items:
                $ref: '#/components/schemas/Remark'
            nonSystemActions:
              type: array
              items:
                $ref: '#/components/schemas/NonSystemAction'
            reviewHistory:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
            associatedExternalCheckId:
              type: string
              format: uuid
              nullable: true
              description: Link to ExternalBackgroundCheck if triggered by Rap Back or NASDTEC

    Remark:
      type: object
      properties:
        remarkId:
          type: string
          format: uuid
        remarkType:
          type: string
          enum: [Internal, External]
        remarkText:
          type: string
        addedBy:
          type: string
        addedAt:
          type: string
          format: date-time

    NonSystemAction:
      type: object
      properties:
        actionId:
          type: string
          format: uuid
        actionType:
          type: string
        description:
          type: string
        loggedBy:
          type: string
        loggedAt:
          type: string
          format: date-time

    StatusHistoryEntry:
      type: object
      properties:
        previousStatus:
          $ref: '#/components/schemas/DisclosureStatus'
        newStatus:
          $ref: '#/components/schemas/DisclosureStatus'
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
        reviewNotes:
          type: string
          nullable: true

    EducatorPprStatus:
      type: object
      properties:
        educatorUniqueId:
          type: string
        accountMarkers:
          type: object
          properties:
            mandatoryHoldRequirement:
              type: boolean
            mandatoryHoldReason:
              type: string
              nullable: true
            enhancedMonitoringStatus:
              type: boolean
            enhancedMonitoringReason:
              type: string
              nullable: true
            reReviewRequirement:
              type: boolean
            reReviewReason:
              type: string
              nullable: true
        annualPprCompliance:
          type: object
          description: Computed property — never stored as a marker
          properties:
            isCompliant:
              type: boolean
            lastResponseDate:
              type: string
              format: date
              nullable: true
            nextDueDate:
              type: string
              format: date
        activeDisclosureCount:
          type: integer
          description: Number of disclosures in active review states
        finalizedDisclosureCount:
          type: integer
          description: Number of disclosures with "Reviewed" statuses

    PprClearanceAssessment:
      type: object
      description: |
        PPR domain's assessment for Credentialing use. Calculated on-demand, never stored.
        Credentialing makes the final approval/denial decision.
      properties:
        clearanceStatus:
          $ref: '#/components/schemas/PprClearanceStatus'
        blockingReason:
          type: string
          nullable: true
          description: Human-readable explanation when status is Hold or Blocked
        districtNotifications:
          type: array
          items:
            type: string
          description: Messages that must be displayed to district users
        requiresFelonyAcknowledgment:
          type: boolean
          description: When true, district must complete felony disclosure acknowledgment form
        reviewTriggers:
          type: array
          items:
            type: string
            enum:
              - MandatoryHoldRequirementActive
              - ReviewedListedDisclosureExists
              - ReviewedFelonyDisclosureExists
              - ActiveReviewDisclosureExists
              - EnhancedMonitoringStatusActive
              - FelonyConvictionRequiresDistrictAcknowledgment
          description: Reasons contributing to the assigned clearance status

    RosterEligibilityAssessment:
      type: object
      description: |
        PPR domain's assessment for Staffing use. Calculated on-demand, never stored.
      properties:
        eligibilityStatus:
          $ref: '#/components/schemas/RosterEligibilityStatus'
        blockingReason:
          type: string
          nullable: true
          description: Human-readable explanation when status is Ineligible
        districtNotifications:
          type: array
          items:
            type: string
          description: Messages that must be displayed to district users

    ExternalBackgroundCheck:
      type: object
      properties:
        checkId:
          type: string
          format: uuid
        checkSource:
          type: string
          enum: [RapBack, CHRISS, NASDTEC]
        educatorUniqueId:
          type: string
        checkDate:
          type: string
          format: date-time
        matchStatus:
          type: string
          enum: [Pending, Received, Matched, RequiresEducatorAction, Resolved]
        requiresEducatorResponse:
          type: boolean
        associatedDisclosureIds:
          type: array
          items:
            type: string
            format: uuid
        rapBackMetadata:
          type: object
          nullable: true
          description: Present only for RapBack checks
          properties:
            tcn:
              type: string
            notificationDate:
              type: string
              format: date
            judicialMarker:
              type: string
            rapSheetRetrievalLog:
              type: array
              description: Audit trail of rap sheet retrievals — content never stored
              items:
                type: object
                properties:
                  retrievedBy:
                    type: string
                  retrievedAt:
                    type: string
                    format: date-time
        nasdtecMetadata:
          type: object
          nullable: true
          description: Present only for NASDTEC checks
          properties:
            jurisdiction:
              type: string
            transactionDate:
              type: string
              format: date
            clearinghouseId:
              type: string
            clearinghouseUrl:
              type: string
              format: uri
              description: Link to full disciplinary record on NASDTEC site (display only)

    WorklistSummary:
      type: object
      properties:
        worklistId:
          type: string
          format: uuid
        worklistName:
          type: string
        status:
          type: string
          enum: [Active, Paused]
        queuedDisclosureCount:
          type: integer
        assignedReviewerCount:
          type: integer

    QuestionConfiguration:
      type: object
      properties:
        formType:
          type: string
          enum: [PPRResponse, SelfDisclosure]
        effectiveDate:
          type: string
          format: date
        questions:
          type: array
          items:
            type: object
            properties:
              questionKey:
                type: string
              questionText:
                type: string
              responseType:
                type: string
                enum: [YesNo, Date, FreeText, FileUpload, Dropdown]
              isRequired:
                type: boolean
              displayOrder:
                type: integer
              branchingLogic:
                type: array
                items:
                  type: object
                  properties:
                    triggerAnswer:
                      type: string
                    followUpQuestionKeys:
                      type: array
                      items:
                        type: string

    MarkerChangeResult:
      type: object
      properties:
        educatorUniqueId:
          type: string
        markerType:
          type: string
          enum: [MandatoryHoldRequirement, EnhancedMonitoringStatus, ReReviewRequirement]
        markerActive:
          type: boolean
        justification:
          type: string
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time

    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

  responses:
    BadRequest:
      description: Validation error or business rule violation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              validationErrors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Conflict:
      description: Optimistic concurrency conflict or duplicate creation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  securitySchemes:
    MiLogin:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://milogin.michigan.gov/oauth/authorize
          tokenUrl: https://milogin.michigan.gov/oauth/token
          scopes:
            profpractice:read: Read disclosure and PPR data
            profpractice:write: Submit disclosures and PPR responses
            profpractice:review: Review and update disclosure status (PPR Reviewer)
            profpractice:admin: Administrative operations (PPR Admin)

security:
  - MiLogin: [profpractice:read]
